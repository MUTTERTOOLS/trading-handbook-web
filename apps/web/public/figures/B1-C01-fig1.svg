<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink, #E7E1D2)"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-red, #C26A63)"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="430" y="38" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">三问漏斗</text>

    <!-- 漏斗三层 -->
    <path d="M300,70 L560,70 L540,150 L320,150 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M320,165 L540,165 L515,245 L345,245 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.09" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M345,260 L515,260 L490,340 L370,340 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.13" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <!-- 漏斗口 -->
    <path d="M370,340 L490,340 L445,378 L415,378 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- 层间小箭头 -->
    <line x1="430" y1="152" x2="430" y2="160" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>
    <line x1="430" y1="247" x2="430" y2="255" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>

    <!-- 层内文字 -->
    <text x="430" y="116" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">期望能否论证</text>
    <text x="430" y="211" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">风险是否可控</text>
    <text x="430" y="306" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">规则是否事先写下</text>

    <!-- 左侧"答不上"出口：汇入赌博式操作 -->
    <line x1="310" y1="110" x2="255" y2="110" stroke="var(--fig-red, #C26A63)" stroke-width="1.8"/>
    <line x1="330" y1="205" x2="255" y2="205" stroke="var(--fig-red, #C26A63)" stroke-width="1.8"/>
    <line x1="355" y1="300" x2="255" y2="300" stroke="var(--fig-red, #C26A63)" stroke-width="1.8"/>
    <line x1="255" y1="110" x2="255" y2="300" stroke="var(--fig-red, #C26A63)" stroke-width="1.8"/>
    <line x1="255" y1="275" x2="234" y2="275" stroke="var(--fig-red, #C26A63)" stroke-width="1.8" marker-end="url(#arr-red)"/>
    <circle cx="255" cy="110" r="3" fill="var(--fig-red, #C26A63)"/>
    <circle cx="255" cy="205" r="3" fill="var(--fig-red, #C26A63)"/>
    <circle cx="255" cy="300" r="3" fill="var(--fig-red, #C26A63)"/>
    <text x="283" y="102" text-anchor="middle" font-size="13" fill="var(--fig-red, #C26A63)">答不上</text>
    <text x="283" y="197" text-anchor="middle" font-size="13" fill="var(--fig-red, #C26A63)">答不上</text>
    <text x="283" y="292" text-anchor="middle" font-size="13" fill="var(--fig-red, #C26A63)">答不上</text>

    <!-- 赌博式操作 -->
    <rect x="60" y="240" width="170" height="70" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.10" stroke="var(--fig-red, #C26A63)" stroke-width="1.8"/>
    <text x="145" y="281" text-anchor="middle" font-size="16" fill="var(--fig-red, #C26A63)">赌博式操作</text>

    <!-- 底部出口 -->
    <line x1="430" y1="378" x2="430" y2="408" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>
    <rect x="280" y="415" width="300" height="70" rx="6" fill="var(--fig-accent, #6B9BC9)" fill-opacity="0.10" stroke="var(--fig-accent, #6B9BC9)" stroke-width="1.8"/>
    <text x="430" y="445" text-anchor="middle" font-size="16" fill="var(--fig-accent, #6B9BC9)">投资或交易</text>
    <text x="430" y="470" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">方法仍需验证</text>
  </g>
</svg>
