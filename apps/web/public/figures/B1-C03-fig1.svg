<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="520" fill="var(--fig-canvas)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <!-- 天平：横梁、支点、立柱、底座 -->
    <line x1="170" y1="120" x2="590" y2="120" stroke="var(--fig-ink)" stroke-width="2"/>
    <circle cx="380" cy="120" r="5" fill="var(--fig-ink)"/>
    <line x1="380" y1="126" x2="380" y2="330" stroke="var(--fig-ink)" stroke-width="2.5"/>
    <rect x="335" y="330" width="90" height="16" rx="3" fill="var(--fig-ink)" fill-opacity="0.15" stroke="var(--fig-ink)" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- 左盘：胜率×平均盈利 -->
    <line x1="170" y1="120" x2="125" y2="190" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.5"/>
    <line x1="170" y1="120" x2="235" y2="190" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M120,190 L240,190 L224,238 L136,238 Z" fill="var(--fig-ink)" fill-opacity="0.06" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.6"/>
    <text x="180" y="208" text-anchor="middle" font-size="14" fill="var(--fig-ink)">胜率×平均盈利</text>

    <!-- 右盘吊索（先画，砝码叠上） -->
    <line x1="590" y1="120" x2="552" y2="190" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.5"/>
    <line x1="590" y1="120" x2="648" y2="190" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M546,190 L654,190 L640,238 L560,238 Z" fill="var(--fig-ink)" fill-opacity="0.06" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.6"/>
    <!-- 右盘砝码：摩擦成本（上，警示黄）+ 败率×平均亏损（下） -->
    <rect x="562" y="138" width="76" height="26" rx="3" fill="var(--fig-yellow)" fill-opacity="0.10" stroke="var(--fig-yellow)" stroke-width="1.6"/>
    <text x="600" y="156" text-anchor="middle" font-size="13" fill="var(--fig-yellow)">摩擦成本</text>
    <rect x="550" y="164" width="100" height="26" rx="3" fill="var(--fig-ink)" fill-opacity="0.08" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.6"/>
    <text x="600" y="182" text-anchor="middle" font-size="13" fill="var(--fig-ink)">败率×平均亏损</text>

    <!-- 三个刻度 -->
    <line x1="80" y1="400" x2="680" y2="400" stroke="var(--fig-ink)" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="180" y1="388" x2="180" y2="412" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.5"/>
    <line x1="380" y1="388" x2="380" y2="412" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.5"/>
    <line x1="580" y1="388" x2="580" y2="412" stroke="var(--fig-ink)" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- EX-E：左轻右重 -->
    <g transform="rotate(12 180 368)">
      <line x1="152" y1="368" x2="208" y2="368" stroke="var(--fig-ink)" stroke-width="2"/>
      <circle cx="152" cy="368" r="3.5" fill="none" stroke="var(--fig-ink)" stroke-opacity="0.8" stroke-width="1.5"/>
      <circle cx="208" cy="368" r="3.5" fill="var(--fig-ink)"/>
    </g>
    <!-- EX-F：左重右轻 -->
    <g transform="rotate(-12 380 368)">
      <line x1="352" y1="368" x2="408" y2="368" stroke="var(--fig-ink)" stroke-width="2"/>
      <circle cx="352" cy="368" r="3.5" fill="var(--fig-ink)"/>
      <circle cx="408" cy="368" r="3.5" fill="none" stroke="var(--fig-ink)" stroke-opacity="0.8" stroke-width="1.5"/>
    </g>
    <!-- EX-G：右略重 -->
    <g transform="rotate(6 580 368)">
      <line x1="552" y1="368" x2="608" y2="368" stroke="var(--fig-ink)" stroke-width="2"/>
      <circle cx="552" cy="368" r="3.5" fill="none" stroke="var(--fig-ink)" stroke-opacity="0.8" stroke-width="1.5"/>
      <circle cx="608" cy="368" r="3.5" fill="var(--fig-ink)"/>
    </g>

    <!-- 刻度标注 -->
    <text x="180" y="434" text-anchor="middle" font-size="14" fill="var(--fig-ink)">EX-E</text>
    <text x="180" y="458" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub)">左轻右重</text>
    <text x="180" y="482" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub)">E=−0.4%</text>
    <text x="380" y="434" text-anchor="middle" font-size="14" fill="var(--fig-ink)">EX-F</text>
    <text x="380" y="458" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub)">左重右轻</text>
    <text x="380" y="482" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub)">E=+1.0% 含成本</text>
    <text x="580" y="434" text-anchor="middle" font-size="14" fill="var(--fig-ink)">EX-G</text>
    <text x="580" y="458" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub)">右略重</text>
    <text x="580" y="482" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub)">E=−0.2%</text>
  </g>
</svg>
