<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="450" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <!-- 检查卡底卡 -->
    <rect x="40" y="56" width="552" height="332" rx="8" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.03" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- 第一行：风① 时① 价② -->
    <rect x="48" y="64" width="166" height="146" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="131" y="96" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">风 ①</text>
    <line x1="75" y1="112" x2="187" y2="112" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.3" stroke-width="1"/>
    <text x="131" y="140" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">外面发生了什么，</text>
    <text x="131" y="162" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">可能波及到谁</text>

    <rect x="228" y="64" width="166" height="146" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="311" y="96" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">时 ①</text>
    <line x1="255" y1="112" x2="367" y2="112" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.3" stroke-width="1"/>
    <text x="311" y="140" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">现在是“什么时候”</text>

    <rect x="408" y="64" width="166" height="146" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="491" y="96" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">价 ②</text>
    <line x1="435" y1="112" x2="547" y2="112" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.3" stroke-width="1"/>
    <text x="491" y="140" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">价格在哪里、</text>
    <text x="491" y="162" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">发生过什么</text>

    <!-- 第二行：量② 仓③ 心④ -->
    <rect x="48" y="224" width="166" height="146" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="131" y="256" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">量 ②</text>
    <line x1="75" y1="272" x2="187" y2="272" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.3" stroke-width="1"/>
    <text x="131" y="300" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">有多少人在动手，</text>
    <text x="131" y="322" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">他们的分歧有多大</text>

    <rect x="228" y="224" width="166" height="146" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="311" y="256" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">仓 ③</text>
    <line x1="255" y1="272" x2="367" y2="272" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.3" stroke-width="1"/>
    <text x="311" y="300" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">这笔事的“剂量”是多少</text>

    <rect x="408" y="224" width="166" height="146" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="491" y="256" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">心 ④</text>
    <line x1="435" y1="272" x2="547" y2="272" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.3" stroke-width="1"/>
    <text x="491" y="300" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">我做的是不是</text>
    <text x="491" y="322" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">我说好的那件事</text>

    <!-- 外挂：成本 C（虚线相连，标"单列"） -->
    <line x1="592" y1="222" x2="632" y2="222" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="608" y="246" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">单列</text>
    <rect x="632" y="190" width="92" height="64" rx="6" fill="var(--fig-yellow, #C9A35B)" fill-opacity="0.10" stroke="var(--fig-yellow, #C9A35B)" stroke-width="1.8"/>
    <text x="678" y="228" text-anchor="middle" font-size="15" fill="var(--fig-yellow, #C9A35B)">成本 C</text>

    <!-- 检查次序脚注（序号依据正文检查惯例） -->
    <text x="316" y="416" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">检查次序：先风时定背景，再看价量看盘面，然后过仓定剂量，最后用心对执行</text>
  </g>
</svg>
