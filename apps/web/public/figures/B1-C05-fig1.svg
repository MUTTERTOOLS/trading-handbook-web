<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink, #E7E1D2)"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <!-- 金字塔三层（自上而下：术、法、道） -->
    <path d="M325,70 L435,70 L465,165 L295,165 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M295,165 L465,165 L505,280 L255,280 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.09" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M255,280 L505,280 L565,420 L195,420 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.13" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>

    <!-- 顶层：术 -->
    <text x="380" y="104" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">术（工具层）</text>
    <text x="380" y="128" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">均线、估值等填空工具</text>
    <text x="380" y="150" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">——〔B4〕〔B5〕</text>

    <!-- 中层：法 -->
    <text x="380" y="208" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">法（规则层）</text>
    <text x="380" y="232" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">何时进、买多少、何时出</text>
    <text x="380" y="254" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">——〔B3〕各章</text>

    <!-- 底层：道 -->
    <text x="380" y="312" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">道（认知层）</text>
    <text x="380" y="338" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">钱从哪来、亏得起多少</text>
    <text x="380" y="360" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">〔B1-C01〕~〔B1-C03〕</text>
    <text x="380" y="382" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">风控底线见〔B3〕各章</text>

    <!-- 顶层旁虚线框：九个衍生工具 -->
    <line x1="437" y1="118" x2="598" y2="120" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="600" y="64" width="150" height="132" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.04" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="675" y="90" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">九个衍生工具</text>
    <text x="675" y="112" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">住在这层：</text>
    <text x="675" y="136" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">势、位（筹）、形、</text>
    <text x="675" y="158" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">劲、流、值、绪、</text>
    <text x="675" y="180" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">比、机</text>

    <!-- 右侧纵向箭头：改动成本自上而下递增 -->
    <line x1="580" y1="90" x2="580" y2="414" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2" marker-end="url(#arr-ink)"/>
    <text x="600" y="250" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">改动成本</text>
    <text x="600" y="272" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">自上而下</text>
    <text x="600" y="294" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">递增</text>
  </g>
</svg>
