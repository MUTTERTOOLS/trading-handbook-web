<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 525" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="525" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">期权买卖双方损益结构（示意）</text>

    <!-- 坐标系 -->
    <line x1="120" y1="85" x2="120" y2="435" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="110" y1="435" x2="700" y2="435" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="110" y1="260" x2="700" y2="260" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="106" y="264" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <line x1="110" y1="178" x2="700" y2="178" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="110" y1="343" x2="700" y2="343" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.18" stroke-width="1"/>
    <text x="112" y="99" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+20,000</text>
    <text x="112" y="182" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+10,000</text>
    <text x="112" y="347" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-10,000</text>
    <text x="112" y="429" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-20,000</text>
    <text x="120" y="458" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">8</text>
    <text x="255" y="458" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">9</text>
    <text x="390" y="458" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">10</text>
    <text x="525" y="458" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">11</text>
    <text x="660" y="458" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">12</text>
    <text x="700" y="482" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">到期价（元）</text>

    <!-- 行权价竖虚线 -->
    <line x1="390" y1="95" x2="390" y2="435" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="390" y="88" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">行权价 10 元</text>

    <!-- 买方折线（册色）与卖方折线（中性墨） -->
    <polyline points="120,277 390,277 660,112" fill="none" stroke="var(--fig-accent, #5FA8A0)" stroke-width="2.2"/>
    <polyline points="120,244 390,244 660,409" fill="none" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2.2"/>
    <circle cx="390" cy="277" r="4" fill="var(--fig-accent, #5FA8A0)"/>
    <circle cx="390" cy="244" r="4" fill="var(--fig-ink, #E7E1D2)"/>
    <text x="560" y="150" text-anchor="middle" font-size="14" fill="var(--fig-accent, #5FA8A0)">买方损益</text>
    <text x="560" y="405" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">卖方损益</text>
    <text x="255" y="232" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+2,000 元</text>
    <text x="255" y="297" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-2,000 元</text>

    <text x="380" y="505" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">独立示意，虚构丙 ETF，数字为示意，规则以最新规定为准</text>
  </g>
</svg>
