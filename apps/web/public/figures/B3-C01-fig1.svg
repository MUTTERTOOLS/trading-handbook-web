<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="540" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">亏损越深，回本越难（EX-H）</text>

    <!-- 主图坐标轴 -->
    <line x1="90" y1="70" x2="90" y2="470" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="90" y1="470" x2="430" y2="470" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <!-- y 刻度 -->
    <text x="82" y="475" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="82" y="395" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="82" y="315" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">40</text>
    <text x="82" y="235" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">60</text>
    <text x="82" y="155" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">80</text>
    <text x="82" y="75" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">100</text>
    <!-- x 刻度 -->
    <text x="90" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="127.8" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">10</text>
    <text x="165.6" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="203.3" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">30</text>
    <text x="241.1" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">40</text>
    <text x="278.9" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">50</text>
    <text x="316.7" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">60</text>
    <text x="354.4" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">70</text>
    <text x="392.2" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">80</text>
    <text x="430" y="490" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">90</text>
    <text x="260" y="514" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">亏损比例（%）</text>
    <text x="50" y="270" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)" transform="rotate(-90 50 270)">回本所需涨幅（%）</text>

    <!-- 参考虚线 y = x -->
    <line x1="90" y1="470" x2="430" y2="110" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="425" y="100" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">y = x：亏多少就涨多少</text>

    <!-- 实际回本曲线 -->
    <polyline points="90,470 127.8,425.6 165.6,370 203.3,298.4 278.9,70" fill="none" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2.4"/>
    <circle cx="127.8" cy="425.6" r="4" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="165.6" cy="370" r="4" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="203.3" cy="298.4" r="4" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="278.9" cy="70" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <text x="134" y="420" text-anchor="start" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">11.1%</text>
    <text x="172" y="365" text-anchor="start" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">25%</text>
    <text x="210" y="293" text-anchor="start" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">42.9%</text>
    <text x="268" y="92" text-anchor="end" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">100%</text>
    <text x="292" y="66" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">亏一半，要翻倍</text>

    <!-- 图例 -->
    <line x1="110" y1="92" x2="140" y2="92" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2.4"/>
    <text x="146" y="96" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">实际所需涨幅</text>
    <line x1="110" y1="114" x2="140" y2="114" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="146" y="118" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">亏多少涨多少（y = x）</text>

    <!-- 放大子图：70%~90% 段 -->
    <rect x="484" y="96" width="244" height="248" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.04" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="606" y="118" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">放大子图（亏损 70%~90% 段）</text>
    <line x1="500" y1="120" x2="500" y2="310" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="500" y1="310" x2="690" y2="310" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="494" y="126" text-anchor="end" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">900</text>
    <text x="494" y="266" text-anchor="end" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">233</text>
    <text x="494" y="314" text-anchor="end" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="500" y="328" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">70</text>
    <text x="595" y="328" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">80</text>
    <text x="690" y="328" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">90</text>
    <text x="595" y="344" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">亏损（%）</text>
    <!-- 子图内 y=x 参考虚线 -->
    <line x1="500" y1="295.2" x2="690" y2="291" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <!-- 子图内实际曲线 -->
    <line x1="500" y1="260.8" x2="690" y2="120" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2.4"/>
    <circle cx="500" cy="260.8" r="4" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="690" cy="120" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <text x="508" y="256" text-anchor="start" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">233%</text>
    <text x="682" y="114" text-anchor="end" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">900%</text>
  </g>
</svg>
