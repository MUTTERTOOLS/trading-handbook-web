<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink, #E7E1D2)"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">四条路，同一副骨架</text>

    <!-- 顶部四个结构框 -->
    <rect x="20" y="56" width="165" height="72" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="102.5" y="80" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">重仓单票</text>
    <text x="102.5" y="100" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">单次亏损 = 仓位 × 跌幅</text>
    <text x="102.5" y="117" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">跌幅无事先上限</text>

    <rect x="199" y="56" width="165" height="72" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="281.5" y="80" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">杠杆</text>
    <text x="281.5" y="100" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">跌幅按倍数放大</text>
    <text x="281.5" y="117" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">一次普通下跌耗尽本金</text>

    <rect x="378" y="56" width="165" height="72" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="460.5" y="80" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">扛单</text>
    <text x="460.5" y="100" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">累积亏损随跌幅与时间</text>
    <text x="460.5" y="117" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">无限累积</text>

    <rect x="557" y="56" width="165" height="72" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="639.5" y="80" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">亏损加仓（马丁式）</text>
    <text x="639.5" y="100" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">所需资金按倍数增长</text>
    <text x="639.5" y="117" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">累积亏损加速</text>

    <!-- 汇流箭头 -->
    <line x1="102.5" y1="128" x2="250" y2="168" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>
    <line x1="281.5" y1="128" x2="350" y2="168" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>
    <line x1="460.5" y1="128" x2="410" y2="168" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>
    <line x1="639.5" y1="128" x2="510" y2="168" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>

    <!-- 中部大框 -->
    <rect x="150" y="172" width="460" height="60" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.08" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.8"/>
    <text x="380" y="208" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">单次或累积亏损无上限 ＋ 无预设退出</text>

    <line x1="380" y1="232" x2="380" y2="270" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>

    <!-- 深水区色带 -->
    <rect x="90" y="274" width="580" height="66" fill="var(--fig-red, #C26A63)" fill-opacity="0.12" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="380" y="302" text-anchor="middle" font-size="15" fill="var(--fig-red, #C26A63)">深水区</text>
    <text x="380" y="326" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">回撤 50%，回本需涨 100%（EX-H）</text>

    <line x1="380" y1="340" x2="380" y2="378" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>

    <!-- 终点框 -->
    <rect x="230" y="382" width="300" height="52" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.10" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.75" stroke-width="1.8"/>
    <text x="380" y="414" text-anchor="middle" font-size="15" fill="var(--fig-red, #C26A63)">账户无法按原计划继续（破产）</text>
  </g>
</svg>
