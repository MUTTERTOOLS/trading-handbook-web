<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">先算风险，再找买点——左：正确顺序；右：三条错误近路</text>

    <!-- 起点灰框 -->
    <rect x="60" y="300" width="120" height="52" rx="6" fill="var(--fig-ink-sub, #A69E8C)" fill-opacity="0.16" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.8" stroke-width="1.6"/>
    <text x="120" y="331" text-anchor="middle" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">想买 / 已买</text>

    <!-- 三条虚线路径扇出 -->
    <line x1="180" y1="318" x2="246" y2="196" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-sub)"/>
    <line x1="180" y1="326" x2="246" y2="330" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-sub)"/>
    <line x1="180" y1="334" x2="246" y2="464" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-sub)"/>

    <!-- 路径一：先买后找止损 -->
    <text x="250" y="172" text-anchor="start" font-size="13" fill="var(--fig-red, #C26A63)">典型一：先买后找止损</text>
    <text x="390" y="172" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">（跳过①②，倒置③）</text>
    <rect x="250" y="182" width="80" height="42" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="290" y="208" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">下单</text>
    <line x1="330" y1="203" x2="356" y2="203" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-sub)"/>
    <rect x="360" y="182" width="180" height="42" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.10" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.75" stroke-width="1.6"/>
    <text x="450" y="208" text-anchor="middle" font-size="13" fill="var(--fig-red, #C26A63)">事后补止损</text>
    <text x="360" y="246" text-anchor="start" font-size="12" fill="var(--fig-red, #C26A63)">止损被仓位倒逼，计划亏损可达 3R</text>

    <!-- 路径二：套牢改口长线 -->
    <text x="250" y="312" text-anchor="start" font-size="13" fill="var(--fig-red, #C26A63)">典型二：套牢改口长线</text>
    <text x="390" y="312" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">（跳过④⑤，伪造一个新②）</text>
    <rect x="250" y="322" width="70" height="42" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="285" y="348" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">触发</text>
    <line x1="320" y1="343" x2="346" y2="343" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-sub)"/>
    <rect x="350" y="322" width="90" height="42" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="395" y="348" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">不执行</text>
    <line x1="440" y1="343" x2="466" y2="343" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-sub)"/>
    <rect x="470" y="322" width="70" height="42" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.10" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.75" stroke-width="1.6"/>
    <text x="505" y="348" text-anchor="middle" font-size="13" fill="var(--fig-red, #C26A63)">改口</text>
    <text x="470" y="386" text-anchor="start" font-size="12" fill="var(--fig-red, #C26A63)">亏损上限变未知</text>

    <!-- 路径三：亏了加仓摊低 -->
    <text x="250" y="452" text-anchor="start" font-size="13" fill="var(--fig-red, #C26A63)">典型三：亏了加仓摊低</text>
    <text x="390" y="452" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">（跳过③④）</text>
    <rect x="250" y="462" width="70" height="42" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="285" y="488" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">浮亏</text>
    <line x1="320" y1="483" x2="346" y2="483" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-sub)"/>
    <rect x="350" y="462" width="80" height="42" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.10" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.75" stroke-width="1.6"/>
    <text x="390" y="488" text-anchor="middle" font-size="13" fill="var(--fig-red, #C26A63)">加仓</text>
    <text x="350" y="526" text-anchor="start" font-size="12" fill="var(--fig-red, #C26A63)">仓位 38%，风险 4R</text>

    <!-- 汇总框 -->
    <rect x="170" y="552" width="420" height="50" rx="6" fill="var(--fig-yellow, #C9A35B)" fill-opacity="0.08" stroke="var(--fig-yellow, #C9A35B)" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="380" y="582" text-anchor="middle" font-size="13.5" fill="var(--fig-yellow, #C9A35B)">共同点：盘中改决定，亏损滑向计划外</text>
  </g>
</svg>
