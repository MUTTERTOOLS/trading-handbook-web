<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="490" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">价格相同，波动不同，止损与仓位完全不同（EX-D）</text>

    <!-- ============ 左栏 X ============ -->
    <text x="210" y="62" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">X</text>
    <!-- 噪音带 19~21 -->
    <rect x="210" y="80" width="130" height="280" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.05"/>
    <text x="282" y="100" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">噪音带 ±1×ATR</text>
    <!-- 入场价竖虚线 -->
    <line x1="275" y1="84" x2="275" y2="344" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="275" y="76" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">入场 20</text>
    <!-- 止损线 -->
    <line x1="145" y1="84" x2="145" y2="344" stroke="var(--fig-red, #C26A63)" stroke-width="2"/>
    <text x="139" y="190" text-anchor="end" font-size="12" fill="var(--fig-red, #C26A63)">止损 18.00</text>
    <text x="139" y="208" text-anchor="end" font-size="11.5" fill="var(--fig-red, #C26A63)">2×ATR，距离 10%</text>
    <!-- 价格轴 -->
    <line x1="80" y1="360" x2="340" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="80" y="378" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">17</text>
    <text x="145" y="378" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">18</text>
    <text x="210" y="378" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">19</text>
    <text x="275" y="378" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="340" y="378" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">21</text>
    <text x="210" y="402" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">价格（元）</text>
    <!-- 仓位条：10% -->
    <rect x="80" y="424" width="260" height="22" fill="none" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="80" y="424" width="26" height="22" fill="var(--fig-accent, #D99058)" fill-opacity="0.45" stroke="var(--fig-accent, #D99058)" stroke-opacity="0.8" stroke-width="1"/>
    <text x="210" y="470" text-anchor="middle" font-size="12.5" fill="var(--fig-accent, #D99058)">仓位 10%</text>

    <!-- ============ 右栏 Y ============ -->
    <text x="570" y="62" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">Y</text>
    <!-- 噪音带 19.9~20.1 -->
    <rect x="613.3" y="80" width="86.7" height="280" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.05"/>
    <text x="576" y="354" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">噪音带 ±1×ATR</text>
    <!-- 入场价竖虚线 -->
    <line x1="656.7" y1="84" x2="656.7" y2="344" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="656.7" y="76" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">入场 20</text>
    <!-- 止损线 -->
    <line x1="570" y1="84" x2="570" y2="344" stroke="var(--fig-red, #C26A63)" stroke-width="2"/>
    <text x="564" y="190" text-anchor="end" font-size="12" fill="var(--fig-red, #C26A63)">止损 19.80</text>
    <text x="564" y="208" text-anchor="end" font-size="11.5" fill="var(--fig-red, #C26A63)">2×ATR，距离 1%</text>
    <!-- 价格轴（放大 10 倍） -->
    <line x1="440" y1="360" x2="700" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="440" y="378" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">19.5</text>
    <text x="570" y="378" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">19.8</text>
    <text x="657" y="378" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">20.0</text>
    <text x="700" y="378" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">20.1</text>
    <text x="570" y="402" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">价格（元）（放大 10 倍）</text>
    <!-- 仓位条：公式需求 100%，上限压回 20% -->
    <rect x="440" y="424" width="260" height="22" fill="none" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="5 4"/>
    <rect x="440" y="424" width="52" height="22" fill="var(--fig-accent, #D99058)" fill-opacity="0.45" stroke="var(--fig-accent, #D99058)" stroke-opacity="0.8" stroke-width="1"/>
    <text x="570" y="470" text-anchor="middle" font-size="12.5" fill="var(--fig-accent, #D99058)">上限压回 20%（公式需求 100%）</text>
  </g>
</svg>
