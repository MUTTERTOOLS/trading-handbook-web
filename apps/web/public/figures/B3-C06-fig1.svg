<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="480" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">仓位越大，跳空越贵（最坏跳空 20% 情形）</text>

    <!-- 坐标轴 -->
    <line x1="100" y1="80" x2="100" y2="380" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="100" y1="380" x2="420" y2="380" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <!-- y 刻度：0~7 -->
    <text x="92" y="385" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="92" y="342" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">1</text>
    <text x="92" y="299" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">2</text>
    <text x="92" y="256" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">3</text>
    <text x="92" y="214" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">4</text>
    <text x="92" y="171" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">5</text>
    <text x="92" y="128" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">6</text>
    <text x="92" y="85" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">7</text>
    <text x="50" y="230" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)" transform="rotate(-90 50 230)">最坏情形本金亏损（%）</text>

    <!-- 柱：5% → 1%，10% → 2%，20% → 4%，30% → 6% -->
    <rect x="129" y="337.1" width="52" height="42.9" fill="var(--fig-accent, #D99058)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="204" y="294.3" width="52" height="85.7" fill="var(--fig-accent, #D99058)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="279" y="208.6" width="52" height="171.4" fill="var(--fig-accent, #D99058)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="354" y="122.9" width="52" height="257.1" fill="var(--fig-accent, #D99058)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="155" y="400" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">5%</text>
    <text x="230" y="400" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">10%</text>
    <text x="305" y="400" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">20%</text>
    <text x="380" y="400" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">30%</text>
    <text x="260" y="428" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">仓位占比（%）</text>

    <!-- 1R 预算虚线 -->
    <line x1="100" y1="337.1" x2="420" y2="337.1" stroke="var(--fig-yellow, #C9A35B)" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="426" y="341" text-anchor="start" font-size="12" fill="var(--fig-yellow, #C9A35B)">单笔风险预算（1R = 1%）</text>

    <!-- 5% 柱顶标注 -->
    <text x="155" y="325" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">EX-C：恰好等于预算</text>

    <text x="420" y="458" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">（独立示意）</text>
  </g>
</svg>
