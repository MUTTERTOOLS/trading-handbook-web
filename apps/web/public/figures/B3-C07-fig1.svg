<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="430" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">同一组合，两种口径，两种结果（EX-O）</text>

    <!-- 坐标轴 -->
    <line x1="140" y1="80" x2="140" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="140" y1="360" x2="560" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <!-- y 刻度 0~8 -->
    <text x="132" y="365" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="132" y="330" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">1</text>
    <text x="132" y="295" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">2</text>
    <text x="132" y="260" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">3</text>
    <text x="132" y="225" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">4</text>
    <text x="132" y="190" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">5</text>
    <text x="132" y="155" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">6</text>
    <text x="132" y="120" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">7</text>
    <text x="132" y="85" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">8</text>
    <text x="52" y="220" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)" transform="rotate(-90 52 220)">占本金比例（%）</text>

    <!-- 上限参考线 y = 5 -->
    <line x1="140" y1="185" x2="560" y2="185" stroke="var(--fig-yellow, #C9A35B)" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="566" y="181" text-anchor="start" font-size="11.5" fill="var(--fig-yellow, #C9A35B)">在途总风险上限 5%</text>
    <text x="566" y="199" text-anchor="start" font-size="11.5" fill="var(--fig-yellow, #C9A35B)">起步参考值，需个人校准</text>

    <!-- 柱一：计划口径 3.75 -->
    <rect x="215" y="228.75" width="90" height="131.25" fill="var(--fig-accent, #D99058)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="260" y="218" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">3.75%</text>
    <text x="260" y="384" text-anchor="middle" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">计划口径</text>

    <!-- 柱二：合并口径 6.0（超限，区分色） -->
    <rect x="395" y="150" width="90" height="210" fill="var(--fig-red, #C26A63)" fill-opacity="0.32" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.8" stroke-width="1.6"/>
    <text x="440" y="126" text-anchor="middle" font-size="13" fill="var(--fig-red, #C26A63)">超限</text>
    <text x="440" y="142" text-anchor="middle" font-size="13" fill="var(--fig-red, #C26A63)">6.0%</text>
    <text x="440" y="384" text-anchor="middle" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">合并口径</text>

    <!-- 悬浮读数热区（D21）：透明命中块，悬停经 data-tip 显示读数 -->
    <g fill="transparent" stroke="none">
      <rect x="215" y="228.75" width="90" height="131.25" data-tip="计划口径 3.75%：只按计划内止损单计算的在途风险"/>
      <rect x="395" y="150" width="90" height="210" data-tip="合并口径 6.0%：把未挂止损或滑点扩大的敞口一并计入，超上限"/>
      <line x1="140" y1="185" x2="560" y2="185" stroke="transparent" stroke-width="9" data-tip="在途总风险上限 5%（起步参考值，需个人校准）"/>
    </g>
  </g>
</svg>
