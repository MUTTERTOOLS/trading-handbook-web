<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">及格线随盈亏比滑动，成本会把线抬高</text>

    <!-- 坐标轴 -->
    <line x1="90" y1="80" x2="90" y2="440" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="90" y1="440" x2="640" y2="440" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.2"/>
    <!-- y 刻度 -->
    <text x="82" y="445" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="82" y="373" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="82" y="301" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">40</text>
    <text x="82" y="229" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">60</text>
    <text x="82" y="157" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">80</text>
    <text x="82" y="85" text-anchor="end" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">100</text>
    <text x="48" y="260" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)" transform="rotate(-90 48 260)">盈亏平衡胜率（%）</text>
    <!-- x 刻度 -->
    <text x="90" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="145" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">0.5</text>
    <text x="200" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">1</text>
    <text x="255" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">1.5</text>
    <text x="310" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">2</text>
    <text x="365" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">2.5</text>
    <text x="420" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">3</text>
    <text x="475" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">3.5</text>
    <text x="530" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">4</text>
    <text x="585" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">4.5</text>
    <text x="640" y="458" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">5</text>
    <text x="365" y="484" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">盈亏比</text>

    <!-- 阴影区：盈亏比 2~3、胜率 35%~45% -->
    <rect x="310" y="278" width="110" height="36" fill="var(--fig-yellow, #C9A35B)" fill-opacity="0.12" stroke="var(--fig-yellow, #C9A35B)" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="365" y="270" text-anchor="middle" font-size="11" fill="var(--fig-yellow, #C9A35B)">示意区间，非标准</text>

    <!-- 实线：不计成本 p = 1/(1+R) -->
    <polyline points="90,80 101,112.7 112,140.1 123,163.1 134,182.9 145,199.9 156,215 167,228.2 178,240 189,250.5 200,260 255,296 310,320.1 365,337.1 420,350 475,360.1 530,368 585,374.5 640,379.9" fill="none" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2.4"/>
    <!-- 虚线：含成本 p = (2+0.2)/(2R+2.2) -->
    <polyline points="145,176.1 200,242 255,287.7 310,307.9 365,329.9 420,341 475,353.9 530,362.3 585,369.3 640,374.1" fill="none" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.8" stroke-dasharray="6 5"/>

    <!-- 图例 -->
    <line x1="445" y1="95" x2="475" y2="95" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2.4"/>
    <text x="481" y="99" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">不计成本</text>
    <line x1="445" y1="117" x2="475" y2="117" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text x="481" y="121" text-anchor="start" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">含成本</text>
    <text x="445" y="143" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">成本口径：平均亏损 2%、</text>
    <text x="445" y="161" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">单笔成本 0.2%（示意设定）</text>

    <!-- 旁注：成本把曲线往上推 -->
    <text x="400" y="416" text-anchor="start" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">成本把曲线往上推</text>
    <line x1="470" y1="400" x2="482" y2="364" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-sub)"/>

    <!-- 标记点 -->
    <circle cx="112" cy="152" r="4.5" fill="none" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.9" stroke-width="2"/>
    <text x="104" y="146" text-anchor="end" font-size="11.5" fill="var(--fig-red, #C26A63)">E</text>
    <circle cx="420" cy="296" r="4.5" fill="none" stroke="var(--fig-accent, #D99058)" stroke-opacity="0.9" stroke-width="2"/>
    <text x="430" y="292" text-anchor="start" font-size="11.5" fill="var(--fig-accent, #D99058)">F</text>
    <circle cx="145" cy="206" r="4.5" fill="none" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.9" stroke-width="2"/>
    <text x="153" y="212" text-anchor="start" font-size="11.5" fill="var(--fig-red, #C26A63)">G</text>

    <!-- 标记点清单 -->
    <text x="100" y="306" text-anchor="start" font-size="11.5" fill="var(--fig-red, #C26A63)">EX-E (0.2, 80%)：线下</text>
    <text x="100" y="326" text-anchor="start" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">EX-F (3, 40%)：线上</text>
    <text x="100" y="346" text-anchor="start" font-size="11.5" fill="var(--fig-red, #C26A63)">EX-G (0.5, 65%)：线下</text>
  </g>
</svg>
