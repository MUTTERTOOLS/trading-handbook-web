<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="560" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">一笔持仓的七种合法退出</text>

    <!-- 扇区①~⑤（持仓级） -->
    <path d="M 380,215 L 380,135 A 175,175 0 0 1 516.8,200.9 L 454.3,250.8 A 95,95 0 0 0 380,215 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.10" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M 454.3,250.8 L 516.8,200.9 A 175,175 0 0 1 550.6,348.9 L 472.6,331.1 A 95,95 0 0 0 454.3,250.8 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.10" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M 472.6,331.1 L 550.6,348.9 A 175,175 0 0 1 455.9,467.7 L 421.2,395.6 A 95,95 0 0 0 472.6,331.1 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.10" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M 421.2,395.6 L 455.9,467.7 A 175,175 0 0 1 304.1,467.7 L 338.8,395.6 A 95,95 0 0 0 421.2,395.6 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.10" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M 338.8,395.6 L 304.1,467.7 A 175,175 0 0 1 209.4,348.9 L 287.4,331.1 A 95,95 0 0 0 338.8,395.6 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.10" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.45" stroke-width="1.3"/>
    <!-- 扇区⑥⑦（账户级与生活级，不同底色） -->
    <path d="M 287.4,331.1 L 209.4,348.9 A 175,175 0 0 1 243.2,200.9 L 305.7,250.8 A 95,95 0 0 0 287.4,331.1 Z" fill="var(--fig-accent, #D99058)" fill-opacity="0.22" stroke="var(--fig-accent, #D99058)" stroke-opacity="0.65" stroke-width="1.3"/>
    <path d="M 305.7,250.8 L 243.2,200.9 A 175,175 0 0 1 380,135 L 380,215 A 95,95 0 0 0 305.7,250.8 Z" fill="var(--fig-accent, #D99058)" fill-opacity="0.22" stroke="var(--fig-accent, #D99058)" stroke-opacity="0.65" stroke-width="1.3"/>

    <!-- 中心圆 -->
    <circle cx="380" cy="310" r="70" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.10" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.6" stroke-width="1.6"/>
    <text x="380" y="316" text-anchor="middle" font-size="15.5" fill="var(--fig-ink, #E7E1D2)">一笔持仓</text>

    <!-- 扇区① -->
    <text x="462" y="128" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">① 开仓逻辑被证伪</text>
    <text x="462" y="146" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">价格证伪</text>
    <!-- 扇区② -->
    <text x="556" y="262" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">② 边际赔率恶化</text>
    <text x="556" y="280" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">赔率变化</text>
    <!-- 扇区③ -->
    <text x="500" y="428" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">③ 时间止损</text>
    <text x="500" y="446" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">日期到期</text>
    <!-- 扇区④ -->
    <text x="380" y="502" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">④ 机会成本换仓</text>
    <text x="380" y="520" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">比较换仓</text>
    <!-- 扇区⑤ -->
    <text x="260" y="428" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">⑤ 组合再平衡</text>
    <text x="260" y="446" text-anchor="end" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">比例偏离</text>
    <!-- 扇区⑥ -->
    <text x="304" y="262" text-anchor="end" font-size="13" fill="var(--fig-accent, #D99058)">⑥ 熔断强制减仓/平仓</text>
    <text x="304" y="280" text-anchor="end" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">账户回撤</text>
    <!-- 扇区⑦ -->
    <text x="348" y="128" text-anchor="end" font-size="13" fill="var(--fig-accent, #D99058)">⑦ 账户外现金需求</text>
    <text x="348" y="146" text-anchor="end" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">生活事件</text>

    <!-- ⑥⑦ 说明 -->
    <rect x="20" y="470" width="180" height="58" rx="6" fill="var(--fig-accent, #D99058)" fill-opacity="0.06" stroke="var(--fig-accent, #D99058)" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="110" y="494" text-anchor="middle" font-size="12" fill="var(--fig-accent, #D99058)">⑥⑦：账户级与生活级</text>
    <text x="110" y="514" text-anchor="middle" font-size="12" fill="var(--fig-accent, #D99058)">对所有持仓生效</text>
  </g>
</svg>
