<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="880" height="600" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="440" y="32" text-anchor="middle" font-size="15.5" fill="var(--fig-ink, #E7E1D2)">复工条件清单——全部满足才复工</text>
    <text x="440" y="54" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">复工条件（起步参考值模板，需个人校准）</text>

    <!-- 节点 1 -->
    <rect x="60" y="76" width="520" height="68" rx="8" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="88" cy="96" r="11" fill="var(--fig-accent, #6B9BC9)" fill-opacity="0.15" stroke="var(--fig-accent, #6B9BC9)" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="88" y="100.5" text-anchor="middle" font-size="12" fill="var(--fig-accent, #6B9BC9)">1</text>
    <text x="108" y="101" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">书面复盘完成</text>
    <text x="108" y="122" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">逐笔标注结论（执行偏差 / 环境变化 / 策略失效 / 正常方差）</text>

    <line x1="320" y1="144" x2="320" y2="164" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.4"/>
    <path d="M320,168 L316.5,159 L323.5,159 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <text x="332" y="160" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">通过</text>

    <!-- 节点 2 -->
    <rect x="60" y="164" width="520" height="68" rx="8" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="88" cy="187" r="11" fill="var(--fig-accent, #6B9BC9)" fill-opacity="0.15" stroke="var(--fig-accent, #6B9BC9)" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="88" y="191.5" text-anchor="middle" font-size="12" fill="var(--fig-accent, #6B9BC9)">2</text>
    <text x="108" y="192" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">执行类问题已有具体改进动作</text>
    <text x="108" y="213" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">（如把下单写进盘前快照〔B7-C03〕）</text>

    <line x1="320" y1="232" x2="320" y2="252" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.4"/>
    <path d="M320,256 L316.5,247 L323.5,247 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <text x="332" y="248" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">通过</text>

    <!-- 节点 3 -->
    <rect x="60" y="252" width="520" height="68" rx="8" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="88" cy="275" r="11" fill="var(--fig-accent, #6B9BC9)" fill-opacity="0.15" stroke="var(--fig-accent, #6B9BC9)" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="88" y="279.5" text-anchor="middle" font-size="12" fill="var(--fig-accent, #6B9BC9)">3</text>
    <text x="108" y="280" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">对"策略是否仍成立"有书面结论</text>
    <text x="108" y="301" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">结论为失效则走停用流程（〔B6-C11〕）</text>

    <line x1="320" y1="320" x2="320" y2="340" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.4"/>
    <path d="M320,344 L316.5,335 L323.5,335 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <text x="332" y="336" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">通过</text>

    <!-- 节点 4 -->
    <rect x="60" y="340" width="520" height="68" rx="8" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="88" cy="363" r="11" fill="var(--fig-accent, #6B9BC9)" fill-opacity="0.15" stroke="var(--fig-accent, #6B9BC9)" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="88" y="367.5" text-anchor="middle" font-size="12" fill="var(--fig-accent, #6B9BC9)">4</text>
    <text x="108" y="368" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">过渡期已写明</text>
    <text x="108" y="389" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">先以原单笔风险的一半或更低交易一段事先定好的笔数或时间，</text>
    <text x="108" y="405" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">期间违规率与回撤达标</text>

    <line x1="320" y1="408" x2="320" y2="428" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.4"/>
    <path d="M320,432 L316.5,423 L323.5,423 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <text x="332" y="424" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">通过</text>

    <!-- 节点 5 -->
    <rect x="60" y="428" width="520" height="68" rx="8" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="88" cy="462" r="11" fill="var(--fig-accent, #6B9BC9)" fill-opacity="0.15" stroke="var(--fig-accent, #6B9BC9)" stroke-opacity="0.8" stroke-width="1.2"/>
    <text x="88" y="466.5" text-anchor="middle" font-size="12" fill="var(--fig-accent, #6B9BC9)">5</text>
    <text x="108" y="459" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">复工期间 H、单笔风险上限</text>
    <text x="108" y="480" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">与任何规则均不放宽</text>

    <!-- 右侧统一"不复工"出口 -->
    <line x1="580" y1="110" x2="641" y2="110" stroke="var(--fig-red, #C26A63)" stroke-width="1.2"/>
    <path d="M648,110 L641,106.5 L641,113.5 Z" fill="var(--fig-red, #C26A63)"/>
    <text x="612" y="102" text-anchor="middle" font-size="11" fill="var(--fig-red, #C26A63)">不满足</text>
    <line x1="580" y1="198" x2="641" y2="198" stroke="var(--fig-red, #C26A63)" stroke-width="1.2"/>
    <path d="M648,198 L641,194.5 L641,201.5 Z" fill="var(--fig-red, #C26A63)"/>
    <text x="612" y="190" text-anchor="middle" font-size="11" fill="var(--fig-red, #C26A63)">不满足</text>
    <line x1="580" y1="286" x2="641" y2="286" stroke="var(--fig-red, #C26A63)" stroke-width="1.2"/>
    <path d="M648,286 L641,282.5 L641,289.5 Z" fill="var(--fig-red, #C26A63)"/>
    <text x="612" y="278" text-anchor="middle" font-size="11" fill="var(--fig-red, #C26A63)">不满足</text>
    <line x1="580" y1="374" x2="641" y2="374" stroke="var(--fig-red, #C26A63)" stroke-width="1.2"/>
    <path d="M648,374 L641,370.5 L641,377.5 Z" fill="var(--fig-red, #C26A63)"/>
    <text x="612" y="366" text-anchor="middle" font-size="11" fill="var(--fig-red, #C26A63)">不满足</text>
    <line x1="580" y1="462" x2="641" y2="462" stroke="var(--fig-red, #C26A63)" stroke-width="1.2"/>
    <path d="M648,462 L641,458.5 L641,465.5 Z" fill="var(--fig-red, #C26A63)"/>
    <text x="612" y="454" text-anchor="middle" font-size="11" fill="var(--fig-red, #C26A63)">不满足</text>

    <rect x="648" y="76" width="182" height="420" rx="8" fill="var(--fig-red, #C26A63)" fill-opacity="0.06" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="739" y="106" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">任一节点不满足</text>
    <text x="739" y="266" text-anchor="middle" font-size="22" fill="var(--fig-red, #C26A63)">不</text>
    <text x="739" y="302" text-anchor="middle" font-size="22" fill="var(--fig-red, #C26A63)">复</text>
    <text x="739" y="338" text-anchor="middle" font-size="22" fill="var(--fig-red, #C26A63)">工</text>

    <!-- 五节点全部通过 → 复工 -->
    <line x1="320" y1="496" x2="320" y2="514" stroke="var(--fig-accent, #6B9BC9)" stroke-width="1.6"/>
    <path d="M320,520 L316.5,510 L323.5,510 Z" fill="var(--fig-accent, #6B9BC9)"/>
    <text x="332" y="510" text-anchor="start" font-size="11" fill="var(--fig-accent, #6B9BC9)">全部通过</text>
    <rect x="150" y="520" width="340" height="44" rx="8" fill="var(--fig-accent, #6B9BC9)" fill-opacity="0.10" stroke="var(--fig-accent, #6B9BC9)" stroke-width="1.8"/>
    <text x="320" y="548" text-anchor="middle" font-size="13.5" fill="var(--fig-accent, #6B9BC9)">复工：恢复原风险交易</text>
  </g>
</svg>
