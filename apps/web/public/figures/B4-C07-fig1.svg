    <!-- 悬浮读数热区（D21）：透明命中圈/块，鼠标悬停经 data-tip 显示读数 -->
    <g fill="transparent" stroke="none">
      <circle cx="130" cy="310" r="10" data-tip="第1日收盘 10.00 元（EMA 起算基点）"/>
      <circle cx="265" cy="260" r="10" data-tip="第2日收盘 10.20 元（上涨）"/>
      <circle cx="400" cy="285" r="10" data-tip="第3日收盘 10.10 元（小幅回落）"/>
      <circle cx="535" cy="210" r="10" data-tip="第4日收盘 10.40 元（再创新高）"/>
      <circle cx="670" cy="160" r="10" data-tip="第5日收盘 10.60 元（五日最高）"/>
      <circle cx="670" cy="202.5" r="9" data-tip="快线 EMA 末端：更贴近收盘价、反应更快"/>
      <circle cx="670" cy="230" r="9" data-tip="慢线 EMA 末端：更平滑、滞后于快线"/>
      <circle cx="265" cy="516" r="9" data-tip="第2日 DIF＝快线−慢线＝+0.03"/>
      <circle cx="400" cy="521.5" r="9" data-tip="第3日 DIF＝+0.02（涨速放缓，DIF 回落）"/>
      <circle cx="535" cy="499.5" r="9" data-tip="第4日 DIF＝+0.06（快慢线重新张口）"/>
      <circle cx="670" cy="472" r="9" data-tip="第5日 DIF＝+0.11（五日最大，仍为正值）"/>
      <circle cx="400" cy="521.5" r="7" data-tip="第3日信号线＝+0.02（DIF 的平滑）"/>
      <circle cx="535" cy="510.5" r="7" data-tip="第4日信号线＝+0.04（滞后于 DIF）"/>
      <circle cx="670" cy="488.5" r="7" data-tip="第5日信号线＝+0.08（低于 DIF）"/>
      <rect x="522" y="521.5" width="26" height="11" data-tip="第4日柱＝DIF−信号线＝+0.02"/>
      <rect x="657" y="516" width="26" height="16.5" data-tip="第5日柱＝DIF−信号线＝+0.03（快线仍在慢线上方）"/>
