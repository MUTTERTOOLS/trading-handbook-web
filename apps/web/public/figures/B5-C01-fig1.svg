<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-accent, #6FA385)"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <!-- 面板标题 -->
    <text x="190" y="48" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">一家小店</text>
    <text x="570" y="48" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">甲公司</text>

    <!-- 左：小店圆饼（60% / 30% / 10%） -->
    <path d="M190,270 L190,180 A90,90 0 1 1 137.1,342.8 Z" fill="var(--fig-accent, #6FA385)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M190,270 L137.1,342.8 A90,90 0 0 1 137.1,197.2 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.30" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M190,270 L137.1,197.2 A90,90 0 0 1 190,180 Z" fill="var(--fig-ink-sub, #A69E8C)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>

    <!-- 左：占比 -->
    <text x="237" y="291" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">60%</text>
    <text x="190" y="326" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">30%</text>
    <text x="174" y="223" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">10%</text>

    <!-- 左：份数与出资额 -->
    <line x1="275.6" y1="297.8" x2="300" y2="312" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="304" y="316" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">你 · 60 份</text>
    <text x="304" y="336" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">出资 120 万</text>

    <text x="190" y="382" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">朋友甲 · 30 份</text>
    <text x="190" y="402" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">出资 80 万</text>

    <line x1="162.2" y1="184.4" x2="120" y2="158" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="116" y="154" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">邻居 · 10 份</text>
    <text x="116" y="174" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">出资 30 万</text>

    <!-- 右：甲公司圆饼（流通股 / 其余股份） -->
    <path d="M570,285 L570,205 A80,80 0 1 1 493.9,260.3 Z" fill="var(--fig-accent, #6FA385)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M570,285 L493.9,260.3 A80,80 0 0 1 570,205 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.25" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="596" y="325" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">流通股</text>
    <text x="596" y="344" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">80%</text>
    <text x="538" y="247" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">其余股份</text>
    <text x="538" y="265" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">20%</text>

    <!-- 右：外接箭头标注 -->
    <text x="570" y="96" text-anchor="middle" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">每一份 = 1 股，股价 15 元（EX-Q）</text>
    <line x1="570" y1="108" x2="570" y2="196" stroke="var(--fig-accent, #6FA385)" stroke-width="1.8" marker-end="url(#arr-accent)"/>
  </g>
</svg>
