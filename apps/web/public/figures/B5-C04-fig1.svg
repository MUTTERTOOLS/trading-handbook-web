<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink, #E7E1D2)"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="165" y="50" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">甲公司（EX-Q）</text>

    <!-- 左侧三个因子框 -->
    <rect x="50" y="72" width="230" height="52" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.07" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="165" y="105" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">净利率 10%</text>
    <text x="165" y="142" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">产品赚不赚钱</text>

    <text x="165" y="172" text-anchor="middle" font-size="22" fill="var(--fig-ink-sub, #A69E8C)">×</text>

    <rect x="50" y="188" width="230" height="52" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.07" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="165" y="221" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">周转率 0.83</text>
    <text x="165" y="258" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">资产跑得快不快</text>

    <text x="165" y="288" text-anchor="middle" font-size="22" fill="var(--fig-ink-sub, #A69E8C)">×</text>

    <rect x="50" y="304" width="230" height="52" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.07" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="165" y="337" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">权益乘数 1.67</text>
    <text x="165" y="374" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">杠杆搭得多高</text>

    <!-- 桥线汇入结果框 -->
    <line x1="280" y1="98" x2="338" y2="210" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <line x1="280" y1="214" x2="338" y2="214" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <line x1="280" y1="330" x2="338" y2="218" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <line x1="338" y1="214" x2="374" y2="214" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>

    <!-- 结果框 -->
    <rect x="380" y="182" width="205" height="64" rx="6" fill="var(--fig-accent, #6FA385)" fill-opacity="0.10" stroke="var(--fig-accent, #6FA385)" stroke-width="1.8"/>
    <text x="482" y="222" text-anchor="middle" font-size="17" fill="var(--fig-accent, #6FA385)">ROE ≈ 13.9%</text>
  </g>
</svg>
