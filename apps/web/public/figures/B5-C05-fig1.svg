<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink, #E7E1D2)"/>
    </marker>
  </defs>
  <rect width="760" height="270" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <!-- 数轴：刻度 10 至 40 -->
    <line x1="50" y1="160" x2="715" y2="160" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2" marker-end="url(#arr-ink)"/>
    <line x1="70" y1="160" x2="70" y2="168" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <line x1="173.3" y1="160" x2="173.3" y2="168" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <line x1="276.7" y1="160" x2="276.7" y2="168" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <line x1="380" y1="160" x2="380" y2="168" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <line x1="483.3" y1="160" x2="483.3" y2="168" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <line x1="586.7" y1="160" x2="586.7" y2="168" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <line x1="690" y1="160" x2="690" y2="168" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="70" y="188" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">10</text>
    <text x="173.3" y="188" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">15</text>
    <text x="276.7" y="188" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="380" y="188" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">25</text>
    <text x="483.3" y="188" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">30</text>
    <text x="586.7" y="188" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">35</text>
    <text x="690" y="188" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">40</text>

    <!-- 10 个历史 PE 数据点 -->
    <circle cx="111.3" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="152.7" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="235.3" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="276.7" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="318" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="380" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="442" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="483.3" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="545.3" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="648.7" cy="160" r="4.5" fill="var(--fig-ink, #E7E1D2)"/>
    <text x="111.3" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">12</text>
    <text x="152.7" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">14</text>
    <text x="235.3" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">18</text>
    <text x="276.7" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">20</text>
    <text x="318" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">22</text>
    <text x="380" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">25</text>
    <text x="442" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">28</text>
    <text x="483.3" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">30</text>
    <text x="545.3" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">33</text>
    <text x="648.7" y="142" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">38</text>

    <!-- 当前值 15：三角形 -->
    <polygon points="173.3,150 165.5,170 181.1,170" fill="var(--fig-accent, #6FA385)"/>
    <line x1="173.3" y1="136" x2="173.3" y2="148" stroke="var(--fig-accent, #6FA385)" stroke-width="1.2"/>
    <text x="173.3" y="132" text-anchor="middle" font-size="12.5" fill="var(--fig-accent, #6FA385)">当前 15</text>
    <text x="215" y="132" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">第 3 位 ÷ 10 ≈ 30%</text>

    <!-- 角标 -->
    <text x="735" y="252" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">示意</text>

    <!-- 悬浮读数热区（D21）：透明命中块，悬停经 data-tip 显示读数 -->
    <g fill="transparent" stroke="none">
      <circle cx="111.3" cy="160" r="10" data-tip="历史 PE 12 倍"/>
      <circle cx="152.7" cy="160" r="10" data-tip="历史 PE 14 倍"/>
      <circle cx="235.3" cy="160" r="10" data-tip="历史 PE 18 倍"/>
      <circle cx="276.7" cy="160" r="10" data-tip="历史 PE 20 倍"/>
      <circle cx="318" cy="160" r="10" data-tip="历史 PE 22 倍"/>
      <circle cx="380" cy="160" r="10" data-tip="历史 PE 25 倍（中位附近）"/>
      <circle cx="442" cy="160" r="10" data-tip="历史 PE 28 倍"/>
      <circle cx="483.3" cy="160" r="10" data-tip="历史 PE 30 倍"/>
      <circle cx="545.3" cy="160" r="10" data-tip="历史 PE 33 倍"/>
      <circle cx="648.7" cy="160" r="10" data-tip="历史 PE 38 倍"/>
      <polygon points="173.3,148 163.5,172 183.1,172" data-tip="当前 PE 15 倍：高于 10 个历史值中的 3 个（12/14/…），分位约 30%"/>
    </g>
  </g>
</svg>
