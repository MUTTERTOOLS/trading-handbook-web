<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 575" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="820" height="575" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="410" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">从回测到实盘，利润被什么吃掉（虚构示意）</text>

    <!-- 坐标系 -->
    <text x="110" y="74" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">年化收益（%）</text>
    <line x1="110" y1="90" x2="110" y2="480" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="110" y1="480" x2="760" y2="480" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="110" y1="90" x2="760" y2="90" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="110" y1="168" x2="760" y2="168" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="110" y1="246" x2="760" y2="246" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="110" y1="324" x2="760" y2="324" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="110" y1="402" x2="760" y2="402" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.15" stroke-width="1"/>
    <text x="102" y="94" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">30</text>
    <text x="102" y="172" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="102" y="250" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">10</text>
    <text x="102" y="328" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="102" y="406" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-10</text>
    <text x="102" y="484" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-20</text>

    <!-- 瀑布导引虚线（各级顶部相连） -->
    <polyline points="162.5,105.6 267.5,214.8 372.5,261.6 477.5,311.5 582.5,324 687.5,426.2" fill="none" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="5 4"/>

    <!-- 六级柱体（中性册色；虚线零轴下为负值） -->
    <rect x="134.5" y="105.6" width="56" height="218.4" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>
    <rect x="239.5" y="214.8" width="56" height="109.2" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>
    <rect x="344.5" y="261.6" width="56" height="62.4" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>
    <rect x="449.5" y="311.5" width="56" height="12.5" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>
    <rect x="554.5" y="324" width="56" height="4.7" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>
    <rect x="659.5" y="324" width="56" height="102.2" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>

    <!-- 各级数值 -->
    <text x="162.5" y="97.6" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">+28</text>
    <text x="267.5" y="206.8" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">+14</text>
    <text x="372.5" y="253.6" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">+8</text>
    <text x="477.5" y="303.5" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">+1.6</text>
    <text x="582.5" y="344.7" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">-0.6</text>
    <text x="687.5" y="444.2" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">约 -13.1</text>

    <!-- 各级右侧原因名（警示黄） -->
    <text x="303.5" y="218.8" text-anchor="start" font-size="12" fill="var(--fig-yellow, #C9A35B)">过拟合</text>
    <text x="408.5" y="265.6" text-anchor="start" font-size="12" fill="var(--fig-yellow, #C9A35B)">数据偏差</text>
    <text x="513.5" y="315.5" text-anchor="start" font-size="12" fill="var(--fig-yellow, #C9A35B)">成本被忽略</text>
    <text x="618.5" y="316" text-anchor="start" font-size="12" fill="var(--fig-yellow, #C9A35B)">市场变化与拥挤</text>
    <text x="723.5" y="433" text-anchor="start" font-size="12" fill="var(--fig-yellow, #C9A35B)">执行偏差＋方差</text>

    <!-- 横轴阶段名 -->
    <text x="162.5" y="502" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">回测原始</text>
    <text x="267.5" y="502" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">修过拟合</text>
    <text x="372.5" y="502" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">修数据</text>
    <text x="477.5" y="502" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">计成本</text>
    <text x="582.5" y="502" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">计拥挤</text>
    <text x="687.5" y="502" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">实盘</text>
    <text x="687.5" y="522" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">半年 -6.8%</text>

    <text x="435" y="556" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">虚构示意：数字为教学推演，实盘值按复利折算年化，非真实策略</text>
  </g>
</svg>
