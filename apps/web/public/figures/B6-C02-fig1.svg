<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">100 次抛硬币的最长连击分布——比直觉长</text>

    <!-- 坐标系 -->
    <text x="104" y="78" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">轮数</text>
    <line x1="110" y1="80" x2="110" y2="380" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="110" y1="380" x2="690" y2="380" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="110" y1="307.5" x2="690" y2="307.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="110" y1="235" x2="690" y2="235" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="110" y1="162.5" x2="690" y2="162.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="110" y1="90" x2="690" y2="90" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.15" stroke-width="1"/>
    <text x="102" y="384" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="102" y="311.5" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">10</text>
    <text x="102" y="239" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="102" y="166.5" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">30</text>
    <text x="102" y="94" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">40</text>

    <!-- 直方柱（模拟示意数据，合计 200 轮） -->
    <rect x="117" y="322" width="44" height="58" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>
    <rect x="175" y="264" width="44" height="116" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>
    <rect x="233" y="177" width="44" height="203" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>
    <rect x="291" y="90" width="44" height="290" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>
    <rect x="349" y="119" width="44" height="261" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>
    <rect x="407" y="191.5" width="44" height="188.5" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>
    <rect x="465" y="249.5" width="44" height="130.5" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>
    <rect x="523" y="278.5" width="44" height="101.5" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>
    <rect x="581" y="314.75" width="44" height="65.25" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>
    <rect x="639" y="343.75" width="44" height="36.25" fill="var(--fig-accent, #C97B96)" fill-opacity="0.75"/>

    <!-- 柱顶轮数 -->
    <text x="139" y="314" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">8</text>
    <text x="197" y="256" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">16</text>
    <text x="255" y="169" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">28</text>
    <text x="313" y="82" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">40</text>
    <text x="371" y="111" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">36</text>
    <text x="429" y="183.5" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">26</text>
    <text x="487" y="241.5" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">18</text>
    <text x="545" y="270.5" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">14</text>
    <text x="603" y="306.75" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">9</text>
    <text x="661" y="335.75" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">5</text>

    <!-- 形态标注 -->
    <text x="400" y="76" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">峰值约在 6~7</text>
    <text x="632" y="262" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">右尾拖长到 10 以上</text>

    <!-- 横轴刻度与标题 -->
    <text x="139" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">3</text>
    <text x="197" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">4</text>
    <text x="255" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">5</text>
    <text x="313" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">6</text>
    <text x="371" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">7</text>
    <text x="429" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">8</text>
    <text x="487" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">9</text>
    <text x="545" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">10</text>
    <text x="603" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">11</text>
    <text x="661" y="400" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">12</text>
    <text x="400" y="424" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">最长连击（笔）</text>

    <text x="400" y="452" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">数据由模拟生成（示意）：每轮 100 次抛硬币，重复约 200 轮</text>
  </g>
</svg>
