<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="380" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">样本越多，读数越稳（EX-L）</text>

    <!-- 坐标系 -->
    <text x="104" y="76" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">胜率（%）</text>
    <line x1="120" y1="90" x2="120" y2="390" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="120" y1="390" x2="690" y2="390" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="120" y1="111" x2="660" y2="111" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="120" y1="173" x2="660" y2="173" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="120" y1="235" x2="660" y2="235" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="120" y1="297" x2="660" y2="297" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="120" y1="359" x2="660" y2="359" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <text x="112" y="115" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">70</text>
    <text x="112" y="177" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">60</text>
    <text x="112" y="239" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">50</text>
    <text x="112" y="301" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">40</text>
    <text x="112" y="363" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">30</text>

    <!-- 真实胜率中线 -->
    <line x1="128" y1="235" x2="655" y2="235" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="136" y="228" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">真实胜率 50%</text>

    <!-- 三层渐窄横带（漏斗） -->
    <polygon points="150,123.4 330,173 330,297 150,346.6" fill="var(--fig-accent, #C97B96)" fill-opacity="0.30"/>
    <polygon points="330,173 620,204 620,266 330,297" fill="var(--fig-accent, #C97B96)" fill-opacity="0.20"/>
    <polyline points="150,123.4 330,173 620,204" fill="none" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8"/>
    <polyline points="150,346.6 330,297 620,266" fill="none" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8"/>

    <!-- 带宽标注 -->
    <text x="158" y="118" text-anchor="start" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">±18（n=30）</text>
    <text x="338" y="168" text-anchor="start" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">±10（n=100）</text>
    <text x="612" y="199" text-anchor="end" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">±5（n=400）</text>

    <!-- 横轴刻度与标题 -->
    <line x1="150" y1="390" x2="150" y2="396" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1"/>
    <line x1="330" y1="390" x2="330" y2="396" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1"/>
    <line x1="620" y1="390" x2="620" y2="396" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1"/>
    <text x="150" y="412" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">30</text>
    <text x="330" y="412" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">100</text>
    <text x="620" y="412" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">400</text>
    <text x="405" y="438" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">回测笔数（档位间距示意）</text>

    <text x="405" y="460" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">横带为围绕真实胜率的读数晃动范围，宽度取 ±18 / ±10 / ±5（EX-L）</text>
  </g>
</svg>
