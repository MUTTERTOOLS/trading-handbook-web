<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink, #E7E1D2)"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-accent, #C97B96)"/>
    </marker>
  </defs>
  <rect width="780" height="500" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="390" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">证据强度阶梯（定义照 1.5）</text>

    <!-- 纵轴：证据可信程度（示意，无刻度） -->
    <line x1="90" y1="425" x2="90" y2="130" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2" marker-end="url(#arr-ink)"/>
    <text transform="rotate(-90 76 280)" x="76" y="280" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">证据可信程度（示意，无刻度）</text>

    <!-- 四级台阶 -->
    <path d="M110,425 L110,360 L250,360 L250,295 L390,295 L390,230 L530,230 L530,165 L670,165 L670,425 Z" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- 各级构成要件（台阶上方） -->
    <text x="180" y="342" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">故事 / 个案 / 口述</text>
    <text x="320" y="277" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">检查表＋决策日志</text>
    <text x="460" y="212" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">机械规则</text>
    <text x="600" y="147" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">机械规则＋样本外通过＋成本已计入</text>

    <!-- 台阶级别字母 -->
    <text x="180" y="396" text-anchor="middle" font-size="20" fill="var(--fig-ink, #E7E1D2)">D</text>
    <text x="320" y="396" text-anchor="middle" font-size="20" fill="var(--fig-ink, #E7E1D2)">C</text>
    <text x="460" y="396" text-anchor="middle" font-size="20" fill="var(--fig-ink, #E7E1D2)">B</text>
    <text x="600" y="396" text-anchor="middle" font-size="20" fill="var(--fig-ink, #E7E1D2)">A</text>

    <!-- 台阶之间的向上箭头 -->
    <line x1="250" y1="356" x2="250" y2="301" stroke="var(--fig-accent, #C97B96)" stroke-width="2" marker-end="url(#arr-acc)"/>
    <line x1="390" y1="291" x2="390" y2="236" stroke="var(--fig-accent, #C97B96)" stroke-width="2" marker-end="url(#arr-acc)"/>
    <line x1="530" y1="226" x2="530" y2="171" stroke="var(--fig-accent, #C97B96)" stroke-width="2" marker-end="url(#arr-acc)"/>

    <!-- 升级动作标注 -->
    <path d="M200,330 Q310,185 405,232" fill="none" stroke="var(--fig-accent, #C97B96)" stroke-width="1.6" marker-end="url(#arr-acc)"/>
    <text x="310" y="202" text-anchor="middle" font-size="12.5" fill="var(--fig-accent, #C97B96)">改写＋回测（D→B）</text>
    <path d="M468,202 Q525,95 585,128" fill="none" stroke="var(--fig-accent, #C97B96)" stroke-width="1.6" marker-end="url(#arr-acc)"/>
    <text x="520" y="90" text-anchor="middle" font-size="12.5" fill="var(--fig-accent, #C97B96)">样本外一次＋成本计入（B→A）</text>
  </g>
</svg>
