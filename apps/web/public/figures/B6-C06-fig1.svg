    <!-- 检验窗与合成曲线带的对齐引线 -->
    <line x1="312" y1="240" x2="312" y2="340" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="760" y1="240" x2="760" y2="340" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4 3"/>

