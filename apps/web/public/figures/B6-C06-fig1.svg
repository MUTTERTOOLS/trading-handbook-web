    <text x="536" y="392" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">合成样本外曲线（16 个检验窗首尾相接）</text>

    <!-- 两点注明 -->
    <text x="410" y="462" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">训练窗与检验窗不重叠，检验窗始终在其训练窗之后</text>
    <text x="410" y="486" text-anchor="middle" font-size="13" fill="var(--fig-ink-sub, #A69E8C)">相邻训练窗彼此重叠，重叠的只是训练数据；检验数据互不重叠</text>

    <text x="410" y="514" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">独立示意参数</text>
