<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="800" height="480" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="400" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">收益要跟回撤一起看（独立示意）</text>

    <!-- 图例 -->
    <rect x="556" y="48" width="14" height="14" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>
    <text x="578" y="60" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">年化收益</text>
    <rect x="656" y="48" width="14" height="14" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.55"/>
    <text x="678" y="60" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">最大回撤</text>

    <!-- 坐标系 -->
    <text x="112" y="78" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">（%）</text>
    <line x1="120" y1="95" x2="120" y2="390" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="120" y1="390" x2="700" y2="390" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="120" y1="310" x2="700" y2="310" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="120" y1="230" x2="700" y2="230" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="120" y1="150" x2="700" y2="150" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <text x="112" y="394" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="112" y="314" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">10</text>
    <text x="112" y="234" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="112" y="154" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">30</text>

    <!-- 甲策略：年化 9%、回撤 15% -->
    <rect x="140" y="318" width="56" height="72" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>
    <text x="168" y="308" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">9%</text>
    <rect x="204" y="270" width="56" height="120" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.55"/>
    <text x="232" y="260" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">15%</text>
    <text x="200" y="414" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">甲策略</text>

    <!-- 宽基全收益：年化 7%、回撤 30% -->
    <rect x="340" y="334" width="56" height="56" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>
    <text x="368" y="324" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">7%</text>
    <rect x="404" y="150" width="56" height="240" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.55"/>
    <text x="432" y="140" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">30%</text>
    <text x="400" y="414" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">宽基全收益</text>

    <!-- 货币基金：年化 2%、回撤约 0.1% -->
    <rect x="540" y="374" width="56" height="16" fill="var(--fig-accent, #C97B96)" fill-opacity="0.8"/>
    <text x="568" y="364" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">2%</text>
    <rect x="604" y="388" width="56" height="2" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.55"/>
    <text x="632" y="378" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">约 0.1%</text>
    <text x="600" y="414" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">货币基金</text>

    <text x="400" y="448" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">数据取自本节表（独立示意）：收益要跟回撤一起看</text>

    <!-- 悬浮读数热区（D21）：透明命中块，悬停经 data-tip 显示读数 -->
    <g fill="transparent" stroke="none">
      <rect x="140" y="318" width="56" height="72" data-tip="甲策略：年化收益 9%"/>
      <rect x="204" y="270" width="56" height="120" data-tip="甲策略：最大回撤 15%——收益 9% 配回撤 15%"/>
      <rect x="340" y="334" width="56" height="56" data-tip="宽基全收益：年化收益 7%"/>
      <rect x="404" y="150" width="56" height="240" data-tip="宽基全收益：最大回撤 30%——收益略低、回撤翻倍"/>
      <rect x="540" y="374" width="56" height="16" data-tip="货币基金：年化收益约 2%"/>
      <rect x="604" y="388" width="56" height="2" data-tip="货币基金：最大回撤约 0.1%（几乎无波动）"/>
    </g>
  </g>
</svg>
