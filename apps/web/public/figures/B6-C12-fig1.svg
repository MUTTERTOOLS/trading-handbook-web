<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 800" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-accent, #C97B96)"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-red, #C26A63)"/>
    </marker>
  </defs>
  <rect width="820" height="800" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="410" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">九步验证清单</text>

    <!-- ① -->
    <rect x="80" y="70" width="400" height="62" rx="6" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="100" y="95" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">① 规则无歧义</text>
    <text x="100" y="117" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">陌生人只凭规则文本能复现每笔交易</text>
    <line x1="280" y1="133" x2="280" y2="146" stroke="var(--fig-accent, #C97B96)" stroke-width="1.8" marker-end="url(#arr-acc)"/>

    <!-- ② -->
    <rect x="80" y="148" width="400" height="62" rx="6" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="100" y="173" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">② 数据质量</text>
    <text x="100" y="195" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">含退市标的、复权正确、当时可得，无前视与幸存者偏差</text>
    <line x1="280" y1="211" x2="280" y2="224" stroke="var(--fig-accent, #C97B96)" stroke-width="1.8" marker-end="url(#arr-acc)"/>

    <!-- ③ -->
    <rect x="80" y="226" width="400" height="62" rx="6" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="100" y="251" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">③ 样本外检验</text>
    <text x="100" y="273" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">按时间三段划分，样本外占比 ≥30%，测试段只动用一次</text>
    <line x1="280" y1="289" x2="280" y2="302" stroke="var(--fig-accent, #C97B96)" stroke-width="1.8" marker-end="url(#arr-acc)"/>

    <!-- ④ -->
    <rect x="80" y="304" width="400" height="62" rx="6" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="100" y="329" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">④ 真实摩擦与制度</text>
    <text x="100" y="351" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">成本按往返口径计入，无法成交按规则处理，扣费后仍为正</text>
    <line x1="280" y1="367" x2="280" y2="380" stroke="var(--fig-accent, #C97B96)" stroke-width="1.8" marker-end="url(#arr-acc)"/>

    <!-- ⑤ -->
    <rect x="80" y="382" width="400" height="62" rx="6" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="100" y="407" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">⑤ 参数高原</text>
    <text x="100" y="429" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">邻近参数表现不崩塌，参数个数尽量少</text>
    <line x1="280" y1="445" x2="280" y2="458" stroke="var(--fig-accent, #C97B96)" stroke-width="1.8" marker-end="url(#arr-acc)"/>

    <!-- ⑥ -->
    <rect x="80" y="460" width="400" height="62" rx="6" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="100" y="485" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">⑥ 回撤与连亏分布</text>
    <text x="100" y="507" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">高分位最大回撤可承受，且 1.5 倍不超过硬上限 H</text>
    <line x1="280" y1="523" x2="280" y2="536" stroke="var(--fig-accent, #C97B96)" stroke-width="1.8" marker-end="url(#arr-acc)"/>

    <!-- ⑦ -->
    <rect x="80" y="538" width="400" height="62" rx="6" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="100" y="563" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">⑦ 基准比较</text>
    <text x="100" y="585" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">同口径下优于宽基全收益定投基准，否则不如定投</text>
    <line x1="280" y1="601" x2="280" y2="614" stroke="var(--fig-accent, #C97B96)" stroke-width="1.8" marker-end="url(#arr-acc)"/>

    <!-- ⑧ -->
    <rect x="80" y="616" width="400" height="62" rx="6" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="100" y="641" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">⑧ 前向小资金实盘</text>
    <text x="100" y="663" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">规则冻结跑满 30~50 笔或 6~12 个月，执行指标达标</text>
    <line x1="280" y1="679" x2="280" y2="692" stroke="var(--fig-accent, #C97B96)" stroke-width="1.8" marker-end="url(#arr-acc)"/>

    <!-- ⑨ -->
    <rect x="80" y="694" width="400" height="62" rx="6" fill="var(--fig-surface, #161A21)" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <text x="100" y="719" text-anchor="start" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">⑨ 停用判据</text>
    <text x="100" y="741" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">三要素与阈值在启用前写入停用声明，触发即执行</text>

    <!-- ⑤⑥⑦ 的"不过"分支汇入停步框 -->
    <line x1="480" y1="413" x2="540" y2="413" stroke="var(--fig-red, #C26A63)" stroke-width="1.6"/>
    <line x1="480" y1="491" x2="540" y2="491" stroke="var(--fig-red, #C26A63)" stroke-width="1.6"/>
    <line x1="480" y1="569" x2="540" y2="569" stroke="var(--fig-red, #C26A63)" stroke-width="1.6"/>
    <line x1="540" y1="413" x2="540" y2="569" stroke="var(--fig-red, #C26A63)" stroke-width="1.6"/>
    <line x1="540" y1="491" x2="576" y2="491" stroke="var(--fig-red, #C26A63)" stroke-width="1.6" marker-end="url(#arr-red)"/>
    <text x="498" y="407" text-anchor="start" font-size="12" fill="var(--fig-red, #C26A63)">不过</text>
    <text x="498" y="485" text-anchor="start" font-size="12" fill="var(--fig-red, #C26A63)">不过</text>
    <text x="498" y="563" text-anchor="start" font-size="12" fill="var(--fig-red, #C26A63)">不过</text>
    <rect x="580" y="464" width="184" height="54" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.18" stroke="var(--fig-red, #C26A63)" stroke-width="1.6"/>
    <text x="672" y="497" text-anchor="middle" font-size="14" fill="var(--fig-red, #C26A63)">停在本步，修复重走</text>
  </g>
</svg>
