<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink, #E7E1D2)"/>
    </marker>
  </defs>
  <rect width="880" height="660" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="440" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">亏损归因诊断决策树</text>

    <!-- 起点 -->
    <rect x="180" y="70" width="340" height="52" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="350" y="101" text-anchor="middle" font-size="14.5" fill="var(--fig-ink, #E7E1D2)">一笔亏损（已记账，R 倍数 = 盈亏 ÷ 1R）</text>
    <line x1="350" y1="122" x2="350" y2="144" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>

    <!-- 第一层菱形 -->
    <path d="M350,148 L545,210 L350,272 L155,210 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="350" y="205" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">对照已存档快照与逐笔记账，</text>
    <text x="350" y="225" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">是否存在书面违规记录？</text>

    <!-- 是 → 右侧结论框一（执行偏差） -->
    <line x1="545" y1="210" x2="572" y2="210" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>
    <text x="558" y="202" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">是</text>
    <rect x="590" y="176" width="268" height="72" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.10" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.75" stroke-width="1.8"/>
    <text x="724" y="203" text-anchor="middle" font-size="15" fill="var(--fig-red, #C26A63)">执行偏差</text>
    <text x="724" y="227" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">动作：违规分级与改进〔B7-C09〕</text>

    <!-- 否 → 向下第二层菱形 -->
    <line x1="350" y1="272" x2="350" y2="298" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>
    <text x="336" y="294" text-anchor="end" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">否</text>

    <!-- 第二层菱形 -->
    <path d="M350,304 L568,372 L350,440 L132,372 Z" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="350" y="352" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">买入逻辑前提是否成立，</text>
    <text x="350" y="372" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">且亏损未超出验证分布</text>
    <text x="350" y="392" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">（报告见〔B6-C12〕；熔断线口径见〔B3-C10〕）？</text>

    <!-- 左下 是 → 结论框二（方差） -->
    <line x1="132" y1="372" x2="132" y2="478" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>
    <text x="146" y="410" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">是</text>
    <rect x="100" y="484" width="280" height="72" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="240" y="511" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">方差</text>
    <text x="240" y="535" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">动作：按计划继续，分布内不缩仓</text>

    <!-- 右下 否 → 结论框三（策略失效） -->
    <line x1="568" y1="372" x2="656" y2="474" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>
    <text x="634" y="414" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">否</text>
    <rect x="520" y="484" width="280" height="72" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.10" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.75" stroke-width="1.8"/>
    <text x="660" y="511" text-anchor="middle" font-size="15" fill="var(--fig-red, #C26A63)">策略失效</text>
    <text x="660" y="535" text-anchor="middle" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">动作：停用评估〔B6-C11〕</text>

    <!-- 图底加注 -->
    <text x="440" y="620" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">熔断触发后的完整排查顺序（心→时→策略）见〔B3-C10〕，本章只覆盖'心'这一支。</text>
  </g>
</svg>
