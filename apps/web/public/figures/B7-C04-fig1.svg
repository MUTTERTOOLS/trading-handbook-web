<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="780" height="460" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="390" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">七类执行偏差的单笔执行成本（独立示意）</text>

    <!-- 网格与坐标轴 -->
    <line x1="190" y1="80" x2="190" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="390" y1="80" x2="390" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="490" y1="80" x2="490" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="590" y1="80" x2="590" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="690" y1="80" x2="690" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="290" y1="78" x2="290" y2="362" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="180" y1="360" x2="740" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <text x="182" y="378" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">−0.5</text>
    <text x="290" y="378" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="390" y="378" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+0.5</text>
    <text x="490" y="378" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+1.0</text>
    <text x="590" y="378" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+1.5</text>
    <text x="690" y="378" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+2.0</text>
    <text x="465" y="406" text-anchor="middle" font-size="13" fill="var(--fig-ink, #E7E1D2)">单笔执行成本（R）</text>

    <!-- 七类偏差条形（数据取本章第四节算例） -->
    <rect x="290" y="90" width="40" height="20" fill="var(--fig-red, #C26A63)" fill-opacity="0.75"/>
    <text x="178" y="104" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">扛单</text>
    <text x="338" y="104" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">+0.2</text>

    <rect x="290" y="128" width="200" height="20" fill="var(--fig-red, #C26A63)" fill-opacity="0.75"/>
    <text x="178" y="142" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">早走</text>
    <text x="498" y="142" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">+1.0</text>

    <rect x="210" y="166" width="80" height="20" fill="var(--fig-yellow, #C9A35B)" fill-opacity="0.75"/>
    <text x="178" y="180" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">违规加仓</text>
    <text x="202" y="180" text-anchor="end" font-size="13" fill="var(--fig-yellow, #C9A35B)">−0.4</text>

    <rect x="290" y="204" width="400" height="20" fill="var(--fig-red, #C26A63)" fill-opacity="0.75"/>
    <text x="178" y="218" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">漏单</text>
    <text x="698" y="218" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">+2.0</text>

    <rect x="290" y="242" width="40" height="20" fill="var(--fig-red, #C26A63)" fill-opacity="0.75"/>
    <text x="178" y="256" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">迟入</text>
    <text x="338" y="256" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">+0.2</text>

    <rect x="290" y="280" width="50" height="20" fill="var(--fig-red, #C26A63)" fill-opacity="0.75"/>
    <text x="178" y="294" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">超仓</text>
    <text x="348" y="294" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">+0.25</text>

    <rect x="290" y="318" width="80" height="20" fill="var(--fig-red, #C26A63)" fill-opacity="0.75"/>
    <text x="178" y="332" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">无信号交易</text>
    <text x="378" y="332" text-anchor="start" font-size="13" fill="var(--fig-ink, #E7E1D2)">+0.4</text>

    <text x="390" y="438" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">负值表示该笔违规偶然多赚</text>
  </g>
</svg>
