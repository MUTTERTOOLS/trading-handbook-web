<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--fig-ink, #E7E1D2)"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="440" y="36" text-anchor="middle" font-size="16" fill="var(--fig-ink, #E7E1D2)">从记账到月度复盘的流水线（示意）</text>

    <!-- 四个主方框 -->
    <rect x="40" y="140" width="170" height="64" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="125" y="177" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">记账表（12 字段）</text>
    <line x1="210" y1="172" x2="246" y2="172" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>

    <rect x="250" y="140" width="170" height="64" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="335" y="177" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">月度统计（七指标）</text>
    <line x1="420" y1="172" x2="456" y2="172" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>

    <rect x="460" y="140" width="130" height="64" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="525" y="177" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">复盘三问</text>
    <line x1="590" y1="172" x2="626" y2="172" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.8" marker-end="url(#arr-ink)"/>

    <rect x="630" y="140" width="200" height="64" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.06" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="730" y="177" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">改进闭环〔B7-C09〕</text>

    <!-- 第三个方框下挂三个小分支 -->
    <line x1="525" y1="204" x2="525" y2="222" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.4"/>
    <line x1="385" y1="222" x2="655" y2="222" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.4"/>
    <line x1="385" y1="222" x2="385" y2="242" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.6" marker-end="url(#arr-ink)"/>
    <line x1="525" y1="222" x2="525" y2="296" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.6" marker-end="url(#arr-ink)"/>
    <line x1="655" y1="222" x2="655" y2="350" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1.6" marker-end="url(#arr-ink)"/>

    <rect x="265" y="246" width="240" height="36" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.04" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.45" stroke-width="1.4"/>
    <text x="385" y="269" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">问一：这个月，我的执行与计划一致吗？</text>

    <rect x="438" y="300" width="174" height="36" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.04" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.45" stroke-width="1.4"/>
    <text x="525" y="323" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">问二：亏损属于哪类归因？</text>

    <rect x="525" y="354" width="260" height="36" rx="6" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.04" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.45" stroke-width="1.4"/>
    <text x="655" y="377" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">问三：下月改什么？这个改动须走重新验证吗？</text>
  </g>
</svg>
