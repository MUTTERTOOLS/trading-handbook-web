<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="880" height="570" fill="var(--fig-canvas, #0B0E14)"/>
