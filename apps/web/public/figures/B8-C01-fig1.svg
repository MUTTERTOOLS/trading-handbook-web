    <path d="M280,433 L273,429.5 L273,436.5 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <line x1="376" y1="433" x2="386" y2="433" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.3"/>
    <path d="M392,433 L385,429.5 L385,436.5 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <line x1="488" y1="433" x2="498" y2="433" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.3"/>
    <path d="M504,433 L497,429.5 L497,436.5 Z" fill="var(--fig-ink-sub, #A69E8C)"/>

