    <!-- 谷底/终点引导线 -->
    <line x1="404" y1="90" x2="404" y2="470" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="714" y1="90" x2="714" y2="470" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- 系列二：定投累计投入（阶梯，右轴） -->
    <path d="M156,442.9 H218 V415.7 H280 V388.6 H342 V361.4 H404 V334.3 H466 V307.1 H528 V280 H590 V252.9 H652 V225.7 H714 V198.6 H726" fill="none" stroke="var(--fig-accent, #B8626E)" stroke-width="1.6" stroke-dasharray="6 4" stroke-opacity="0.9"/>

    <!-- 系列四：一次性市值（右轴） -->
    <polyline points="156,198.6 218,225.7 280,239.3 342,252.9 404,280 466,252.9 528,239.3 590,225.7 652,212.1 714,185" fill="none" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.8"/>

    <!-- 系列三：定投市值（右轴） -->
    <polyline points="156,442.9 218,418.4 280,394.1 342,371.5 404,356.7 466,313.3 528,276.4 590,237.8 652,197.8 714,142" fill="none" stroke="var(--fig-accent, #B8626E)" stroke-width="2"/>

    <!-- 系列一：净值路径（左轴，独立示意） -->
    <polyline points="156,166 218,242 280,280 342,318 404,394 466,318 528,280 590,242 652,204 714,128" fill="none" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2"/>

    <!-- 谷底（时点 5）与终点（时点 10）标注 -->
    <circle cx="404" cy="394" r="3" fill="var(--fig-ink, #E7E1D2)"/>
    <circle cx="404" cy="356.7" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="404" cy="280" r="3" fill="var(--fig-ink-sub, #A69E8C)"/>
    <text x="404" y="414" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">谷底</text>
    <rect x="412" y="334" width="120" height="22" fill="var(--fig-surface, #161A21)" fill-opacity="0.92"/>
    <text x="417" y="350" text-anchor="start" font-size="11.5" fill="var(--fig-accent, #B8626E)">定投 −16.5%</text>
    <rect x="412" y="288" width="124" height="22" fill="var(--fig-surface, #161A21)" fill-opacity="0.92"/>
    <text x="417" y="304" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">一次性 −30%</text>
    <circle cx="714" cy="142" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="714" cy="185" r="3" fill="var(--fig-ink-sub, #A69E8C)"/>
    <rect x="588" y="106" width="118" height="22" fill="var(--fig-surface, #161A21)" fill-opacity="0.92"/>
    <text x="593" y="122" text-anchor="start" font-size="11.5" fill="var(--fig-accent, #B8626E)">定投 +20.8%</text>
    <rect x="588" y="152" width="124" height="22" fill="var(--fig-surface, #161A21)" fill-opacity="0.92"/>
    <text x="593" y="168" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">一次性 +5.0%</text>

    <text x="430" y="545" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">虚构数据：定投每期投入 1,000 元，共 10 期；盈亏比例按市值相对累计投入计算</text>

    <!-- 悬浮读数热区（D21）：透明命中块，悬停经 data-tip 显示读数 -->
    <g fill="transparent" stroke="none">
      <circle cx="404" cy="394" r="10" data-tip="净值谷底 0.7 元（时点 5）：先跌后涨路径最低点"/>
      <circle cx="404" cy="356.7" r="10" data-tip="谷底时定投浮亏 −16.5%（市值相对累计投入）——低位仍在买入"/>
      <circle cx="404" cy="280" r="10" data-tip="谷底时一次性买入浮亏 −30%"/>
      <circle cx="714" cy="142" r="10" data-tip="终点（时点 10）：定投 +20.8%——低位买到的便宜份额放大了反弹收益"/>
      <circle cx="714" cy="185" r="10" data-tip="终点（时点 10）：一次性买入 +5.0%"/>
      <circle cx="680" cy="225.7" r="10" data-tip="定投累计投入持续抬升：第 9 期后约 9,000~10,000 元"/>
    </g>
  </g>
</svg>
