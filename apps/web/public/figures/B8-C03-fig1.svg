    <text x="156" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">1</text>
    <text x="218" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">2</text>
    <text x="280" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">3</text>
    <text x="342" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">4</text>
    <text x="404" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">5</text>
    <text x="466" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">6</text>
    <text x="528" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">7</text>
    <text x="590" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">8</text>
    <text x="652" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">9</text>
    <text x="714" y="492" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">10</text>
