    <text x="730" y="78" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">金额（元）</text>
    <line x1="110" y1="90" x2="110" y2="470" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="730" y1="90" x2="730" y2="470" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="110" y1="470" x2="730" y2="470" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="110" y1="166" x2="730" y2="166" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="242" x2="730" y2="242" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="318" x2="730" y2="318" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="394" x2="730" y2="394" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="90" x2="730" y2="90" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <text x="102" y="94" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">1.1</text>
    <text x="102" y="170" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">1.0</text>
    <text x="102" y="246" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0.9</text>
    <text x="102" y="322" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0.8</text>
    <text x="102" y="398" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0.7</text>
    <text x="102" y="474" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0.6</text>
    <text x="738" y="94" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">14,000</text>
    <text x="738" y="148" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">12,000</text>
    <text x="738" y="202" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">10,000</text>
    <text x="738" y="257" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">8,000</text>
    <text x="738" y="311" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">6,000</text>
    <text x="738" y="365" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">4,000</text>
    <text x="738" y="420" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">2,000</text>
    <text x="738" y="474" text-anchor="start" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">0</text>

