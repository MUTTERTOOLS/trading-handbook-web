    <text x="306" y="62" text-anchor="start" font-size="12" fill="var(--fig-accent, #B8626E)">定投累计投入（右轴）</text>
    <line x1="470" y1="58" x2="490" y2="58" stroke="var(--fig-accent, #B8626E)" stroke-width="2"/>
    <text x="496" y="62" text-anchor="start" font-size="12" fill="var(--fig-accent, #B8626E)">定投市值（右轴）</text>
    <line x1="650" y1="58" x2="670" y2="58" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.8"/>
    <text x="676" y="62" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">一次性市值（右轴）</text>

