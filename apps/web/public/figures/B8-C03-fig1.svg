<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="580" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="430" y="32" text-anchor="middle" font-size="15.5" fill="var(--fig-ink, #E7E1D2)">先跌后涨示意路径下定投与一次性买入对比（虚构数据）</text>

    <!-- 图例 -->
    <line x1="120" y1="58" x2="140" y2="58" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2"/>
    <text x="146" y="62" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">净值路径（左轴）</text>
