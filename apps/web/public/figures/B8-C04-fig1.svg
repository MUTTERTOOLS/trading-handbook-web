<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="850" height="560" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="425" y="32" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">虚构示意：20 格网格在单边下跌中的逐格买入与浮亏</text>

    <!-- 图例 -->
    <line x1="120" y1="56" x2="150" y2="56" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2"/>
    <text x="156" y="60" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">阶梯下跌路径</text>
    <circle cx="330" cy="56" r="3" fill="var(--fig-accent, #B8626E)"/>
    <text x="342" y="60" text-anchor="start" font-size="12" fill="var(--fig-accent, #B8626E)">逐格买入点</text>

    <!-- 坐标系：纵轴价格 0.85~1.25 -->
    <line x1="100" y1="80" x2="100" y2="480" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="100" y1="480" x2="770" y2="480" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="100" y1="80" x2="770" y2="80" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="100" y1="130" x2="770" y2="130" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="100" y1="180" x2="770" y2="180" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="100" y1="230" x2="770" y2="230" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="100" y1="280" x2="770" y2="280" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="100" y1="380" x2="770" y2="380" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="100" y1="430" x2="770" y2="430" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.25" stroke-width="1"/>
    <text x="92" y="84" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">1.25</text>
    <text x="92" y="134" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">1.20</text>
    <text x="92" y="184" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">1.15</text>
    <text x="92" y="234" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">1.10</text>
    <text x="92" y="284" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">1.05</text>
    <text x="92" y="334" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">1.00</text>
    <text x="92" y="384" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0.95</text>
    <text x="92" y="434" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0.90</text>
    <text x="92" y="484" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0.85</text>

    <!-- 横轴格位 0~21 -->
    <text x="104" y="502" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="198.2" y="502" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">3</text>
    <text x="292.4" y="502" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">6</text>
    <text x="386.6" y="502" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">9</text>
    <text x="480.8" y="502" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">12</text>
    <text x="575" y="502" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">15</text>
    <text x="669.2" y="502" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">18</text>
    <text x="763.4" y="502" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">21</text>
    <text x="786" y="502" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">格位序号</text>

    <!-- 上沿 1.20 / 下沿 1.00 虚线 -->
    <line x1="100" y1="130" x2="770" y2="130" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="776" y="134" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">上沿 1.20</text>
    <line x1="100" y1="330" x2="770" y2="330" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2" stroke-dasharray="7 5"/>
    <text x="776" y="334" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">下沿 1.00</text>

    <!-- 阶梯线：自 1.20 逐格下降至 1.00，再垂直落至 0.90 -->
    <path d="M104,130 H135.4 V140 H166.8 V150 H198.2 V160 H229.6 V170 H261 V180 H292.4 V190 H323.8 V200 H355.2 V210 H386.6 V220 H418 V230 H449.4 V240 H480.8 V250 H512.2 V260 H543.6 V270 H575 V280 H606.4 V290 H637.8 V300 H669.2 V310 H700.6 V320 H732 V330 H763.4 V430" fill="none" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2"/>

    <!-- 每个台阶的买入点 -->
    <circle cx="119.7" cy="140" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="151.1" cy="150" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="182.5" cy="160" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="213.9" cy="170" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="245.3" cy="180" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="276.7" cy="190" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="308.1" cy="200" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="339.5" cy="210" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="370.9" cy="220" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="402.3" cy="230" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="433.7" cy="240" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="465.1" cy="250" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="496.5" cy="260" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="527.9" cy="270" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="559.3" cy="280" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="590.7" cy="290" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="622.1" cy="300" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="653.5" cy="310" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="684.9" cy="320" r="3" fill="var(--fig-accent, #B8626E)"/>
    <circle cx="716.3" cy="330" r="3" fill="var(--fig-accent, #B8626E)"/>

    <!-- 终点与浮亏标注（警示黄） -->
    <circle cx="763.4" cy="430" r="3.5" fill="var(--fig-ink, #E7E1D2)"/>
    <text x="560" y="318" text-anchor="middle" font-size="12" fill="var(--fig-yellow, #C9A35B)">浮亏 −1,900 元（−8.7%）</text>
    <text x="560" y="418" text-anchor="middle" font-size="12" fill="var(--fig-yellow, #C9A35B)">浮亏 −3,900 元（−17.8%）</text>

    <text x="425" y="546" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">虚构示意：格距 0.01 元、路径与浮亏均为教学口径，非真实行情</text>
  </g>
</svg>
