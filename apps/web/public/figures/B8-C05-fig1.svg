<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="840" height="540" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="420" y="32" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">低胜率高盈亏比的典型路径形态（虚构示意）</text>

