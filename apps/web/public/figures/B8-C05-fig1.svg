    <line x1="110" y1="450" x2="760" y2="450" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="110" y1="120" x2="760" y2="120" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="150" x2="760" y2="150" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="180" x2="760" y2="180" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="210" x2="760" y2="210" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="240" x2="760" y2="240" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="300" x2="760" y2="300" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="330" x2="760" y2="330" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="360" x2="760" y2="360" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="390" x2="760" y2="390" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="420" x2="760" y2="420" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="110" y1="270" x2="760" y2="270" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="102" y="94" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+6</text>
    <text x="102" y="124" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+5</text>
    <text x="102" y="154" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+4</text>
    <text x="102" y="184" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+3</text>
    <text x="102" y="214" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+2</text>
    <text x="102" y="244" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">+1</text>
    <text x="102" y="274" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="102" y="304" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-1</text>
    <text x="102" y="334" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-2</text>
    <text x="102" y="364" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-3</text>
    <text x="102" y="394" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-4</text>
    <text x="102" y="424" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">-5</text>
    <text x="110" y="470" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">1</text>
    <text x="199.7" y="470" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">5</text>
    <text x="312.1" y="470" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">10</text>
    <text x="423.8" y="470" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">15</text>
    <text x="535.9" y="470" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="648" y="470" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">25</text>
    <text x="760" y="470" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">30</text>
    <text x="770" y="470" text-anchor="start" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">交易序号</text>
    <text x="70" y="274" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">累计（R）</text>

    <!-- 磨损段底纹（−5R~−1R 区间，前 12 笔） -->
    <rect x="110" y="300" width="265" height="120" fill="var(--fig-yellow, #C9A35B)" fill-opacity="0.07" stroke="var(--fig-yellow, #C9A35B)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- 累计 R 曲线（虚构序列） -->
    <polyline points="110,330 132.4,357 154.8,333 177.2,360 199.7,384 222.1,357 244.5,381 266.9,354 289.3,378 311.7,405 334.1,378 356.6,402 379,297 401.4,324 423.8,297 446.2,324 468.6,297 491,324 513.5,297 535.9,324 558.3,204 580.7,231 603.1,186 625.6,213 648,168 670.4,195 692.8,150 715.2,177 737.6,132 760,90" fill="none" stroke="var(--fig-ink, #E7E1D2)" stroke-width="2"/>

    <!-- 磨损段标注 -->
    <text x="146" y="415" text-anchor="start" font-size="11.5" fill="var(--fig-yellow, #C9A35B)">连亏是常态（独立示意）</text>

    <!-- 两个大台阶 -->
    <circle cx="379" cy="297" r="3.5" fill="var(--fig-accent, #B8626E)"/>
    <text x="379" y="284" text-anchor="middle" font-size="12" fill="var(--fig-accent, #B8626E)">+3.5R</text>
    <text x="379" y="470" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-sub, #A69E8C)">第13笔</text>
    <circle cx="558.3" cy="204" r="3.5" fill="var(--fig-accent, #B8626E)"/>
    <text x="558.3" y="191" text-anchor="middle" font-size="12" fill="var(--fig-accent, #B8626E)">+4R</text>
    <text x="578" y="470" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-sub, #A69E8C)">第21笔</text>

    <!-- 终点 -->
    <circle cx="760" cy="90" r="3.5" fill="var(--fig-accent, #B8626E)"/>
    <text x="758" y="76" text-anchor="end" font-size="13" fill="var(--fig-accent, #B8626E)">净 +6R</text>

    <text x="420" y="515" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">虚构示意：累计路径为教学构造，期望为正不排除磨损与连亏</text>
  </g>
</svg>
