<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="520" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="430" y="32" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">虚构示意：门派 D 起步的资金分布与三道校验</text>

    <!-- 15% 单票上限虚线（警示黄） -->
    <line x1="246" y1="84" x2="246" y2="410" stroke="var(--fig-yellow, #C9A35B)" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="252" y="80" text-anchor="start" font-size="12" fill="var(--fig-yellow, #C9A35B)">单票上限（门派 D ≤15%，起步参考值）</text>

    <!-- 坐标系：横轴占本金比例 0~100% -->
    <line x1="150" y1="410" x2="790" y2="410" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>
    <text x="150" y="432" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">0</text>
    <text x="278" y="432" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">20</text>
    <text x="406" y="432" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">40</text>
    <text x="534" y="432" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">60</text>
    <text x="662" y="432" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">80</text>
    <text x="790" y="432" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">100</text>
    <text x="470" y="458" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">占本金比例（%）</text>

    <!-- 六根持仓条（路径 B 口径，各 4%） -->
    <text x="140" y="116" text-anchor="end" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">持仓 1</text>
    <rect x="150" y="96" width="25.6" height="30" fill="var(--fig-accent, #B8626E)" fill-opacity="0.6"/>
    <text x="184" y="116" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">4%</text>
    <text x="140" y="160" text-anchor="end" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">持仓 2</text>
    <rect x="150" y="140" width="25.6" height="30" fill="var(--fig-accent, #B8626E)" fill-opacity="0.6"/>
    <text x="184" y="160" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">4%</text>
    <text x="140" y="204" text-anchor="end" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">持仓 3</text>
    <rect x="150" y="184" width="25.6" height="30" fill="var(--fig-accent, #B8626E)" fill-opacity="0.6"/>
    <text x="184" y="204" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">4%</text>
    <text x="140" y="248" text-anchor="end" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">持仓 4</text>
    <rect x="150" y="228" width="25.6" height="30" fill="var(--fig-accent, #B8626E)" fill-opacity="0.6"/>
    <text x="184" y="248" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">4%</text>
    <text x="140" y="292" text-anchor="end" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">持仓 5</text>
    <rect x="150" y="272" width="25.6" height="30" fill="var(--fig-accent, #B8626E)" fill-opacity="0.6"/>
    <text x="184" y="292" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">4%</text>
    <text x="140" y="336" text-anchor="end" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">持仓 6</text>
    <rect x="150" y="316" width="25.6" height="30" fill="var(--fig-accent, #B8626E)" fill-opacity="0.6"/>
    <text x="184" y="336" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">4%</text>

    <!-- 现金条 76% -->
    <text x="140" y="380" text-anchor="end" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">现金</text>
    <rect x="150" y="360" width="486.4" height="30" fill="var(--fig-ink-sub, #A69E8C)" fill-opacity="0.35"/>
    <text x="626" y="380" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">76%</text>

    <!-- 图下角：在途上限校验 -->
    <text x="150" y="488" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">6 × 0.8% = 4.8% ≤ 5% 在途上限</text>
    <text x="790" y="488" text-anchor="end" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">起步参考值，需个人校准</text>
  </g>
</svg>
