<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="880" height="770" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="440" y="34" text-anchor="middle" font-size="15.5" fill="var(--fig-ink, #E7E1D2)">门派 E 拆解卡（仅供了解，不作为新手起步门派）</text>

    <!-- 卡片 -->
    <rect x="40" y="50" width="800" height="698" rx="10" fill="var(--fig-surface, #161A21)" fill-opacity="0.30" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="64" y="80" text-anchor="start" font-size="15" font-weight="600" fill="var(--fig-ink, #E7E1D2)">门派 E · A 股超短游资</text>
    <text x="726" y="80" text-anchor="end" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">〔B8-C02〕九字段模板</text>
    <rect x="738" y="62" width="78" height="26" rx="13" fill="var(--fig-yellow, #C9A35B)" fill-opacity="0.08" stroke="var(--fig-yellow, #C9A35B)" stroke-opacity="0.85" stroke-width="1.2"/>
    <text x="777" y="80" text-anchor="middle" font-size="12.5" fill="var(--fig-yellow, #C9A35B)">仅供了解</text>
    <line x1="40" y1="96" x2="840" y2="96" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.4" stroke-width="1"/>

    <!-- ① 收益来源 -->
    <text x="64" y="117" text-anchor="start" font-size="13" fill="var(--fig-accent, #6B9BC9)">① 收益来源</text>
    <text x="64" y="138" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">行为偏差（情绪传染与跟风追价；对手盘：被情绪卷入的接力资金）＋制度约束（涨跌停</text>
    <text x="64" y="157" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">与 T+1 的分段释放；对手盘：被制度延迟或锁定的资金）。</text>
    <line x1="40" y1="169" x2="840" y2="169" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.25" stroke-width="1"/>
    <!-- ② 5+1 调用 -->
    <text x="64" y="190" text-anchor="start" font-size="13" fill="var(--fig-accent, #6B9BC9)">② 5+1 调用</text>
    <text x="64" y="211" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">价（涨停价与盘口）、量（封单与成交节奏）、时（盘中分钟级，T+1 时钟）、风（基本面</text>
    <text x="64" y="230" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">外部信息基本不用，靠盘中消息与情绪）、仓（集中度高，单票占比常远超手册上限——如实写）、</text>
    <text x="64" y="249" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">心（盘中即时决策，执行残差极大）、成本 C（高频往返，费用是生死线）。核心格：价、量、心。</text>
    <line x1="40" y1="261" x2="840" y2="261" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.25" stroke-width="1"/>
    <!-- ③ 配平方式 -->
    <text x="64" y="282" text-anchor="start" font-size="13" fill="var(--fig-accent, #6B9BC9)">③ 配平方式</text>
    <text x="64" y="303" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">盈亏比 &lt;1（赢小亏大），靠高胜率硬撑（〔B3-C08〕超短区）；频率极高。逐步算例见正文第四节。</text>
    <line x1="40" y1="334" x2="840" y2="334" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.25" stroke-width="1"/>
    <!-- ④ 风控方式 -->
    <text x="64" y="355" text-anchor="start" font-size="13" fill="var(--fig-accent, #6B9BC9)">④ 风控方式</text>
    <text x="64" y="376" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">依赖盘中即时止损反应；盘前快照（〔B7-C03〕）最多锁住"今天不做"，锁不住盘中动作；</text>
    <text x="64" y="395" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">手册风控（1R、在途、熔断）在其节奏下无法逐笔执行。</text>
    <line x1="40" y1="407" x2="840" y2="407" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.25" stroke-width="1"/>
    <!-- ⑤ 退出条件 -->
    <text x="64" y="428" text-anchor="start" font-size="13" fill="var(--fig-accent, #6B9BC9)">⑤ 退出条件</text>
    <text x="64" y="449" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">高度依赖盘中反应，与本书七种退出的规则化框架不兼容（结构⑤如实声明）。</text>
    <line x1="40" y1="461" x2="840" y2="461" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.25" stroke-width="1"/>
    <!-- ⑥ 证据强度 -->
    <text x="64" y="482" text-anchor="start" font-size="13" fill="var(--fig-accent, #6B9BC9)">⑥ 证据强度</text>
    <text x="64" y="503" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">晒单、故事、课程话术默认 D（〔B6-C04〕）；且多数宣称无法验证（结构⑦）。</text>
    <line x1="40" y1="515" x2="840" y2="515" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.25" stroke-width="1"/>
    <!-- ⑦ 成本与容量 -->
    <text x="64" y="536" text-anchor="start" font-size="13" fill="var(--fig-accent, #6B9BC9)">⑦ 成本与容量</text>
    <text x="64" y="557" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">往返成本随频率放大（EX-P 口径）；个人小资金的冲击成本尚可接受，但方法整体有容量</text>
    <text x="64" y="576" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">天花板（大资金进出涨停股，自身即冲击，〔B4-C07〕口径）。</text>
    <line x1="40" y1="588" x2="840" y2="588" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.25" stroke-width="1"/>
    <!-- ⑧ 失效条件 -->
    <text x="64" y="609" text-anchor="start" font-size="13" fill="var(--fig-accent, #6B9BC9)">⑧ 失效条件</text>
    <text x="64" y="630" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">情绪跟风生态变化、涨停与 T+1 等制度参数调整※、同类参与者拥挤、对异常交易</text>
    <text x="64" y="649" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">行为的监管执行收紧（〔B2-C08〕）——任一条改写前提。</text>
    <line x1="40" y1="661" x2="840" y2="661" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.25" stroke-width="1"/>
    <!-- ⑨ 与我的适配 -->
    <text x="64" y="682" text-anchor="start" font-size="13" fill="var(--fig-accent, #6B9BC9)">⑨ 与我的适配</text>
    <text x="64" y="703" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">四问（〔B8-C08〕）在此章答案先行：需全天候盯盘（与本职冲突）、尾部亏损大、合规边界</text>
    <text x="64" y="722" text-anchor="start" font-size="12.5" fill="var(--fig-ink, #E7E1D2)">近、无法按本书框架执行——新手四问全部不通过。结论：不作为新手起步门派。</text>

    <!-- 悬浮读数热区（D21）：透明命中块，悬停经 data-tip 显示读数 -->
    <g fill="transparent" stroke="none">
      <rect x="42" y="97" width="796" height="71" data-tip="①收益来源——行为偏差（情绪传染与跟风追价）＋制度约束（涨跌停与 T+1 的分段释放）；对手盘分别为被情绪卷入的接力资金与被制度延迟或锁定的资金。"/>
      <rect x="42" y="170" width="796" height="90" data-tip="②5+1 调用——价（涨停价与盘口）、量（封单与成交节奏）、时（盘中分钟级）、风（基本面信息基本不用）、仓（集中度高，常远超手册上限——如实写）、心（盘中即时决策，执行残差极大）、成本 C（高频往返）。核心格：价、量、心。"/>
      <rect x="42" y="262" width="796" height="71" data-tip="③配平方式——盈亏比 &lt;1（赢小亏大），靠高胜率硬撑（〔B3-C08〕超短区）；频率极高。逐步算例见正文第四节。"/>
      <rect x="42" y="335" width="796" height="71" data-tip="④风控方式——依赖盘中即时止损反应；盘前快照最多锁住&quot;今天不做&quot;，锁不住盘中动作；手册风控（1R、在途、熔断）在其节奏下无法逐笔执行。"/>
      <rect x="42" y="408" width="796" height="52" data-tip="⑤退出条件——高度依赖盘中反应，与本书七种退出的规则化框架不兼容（结构⑤如实声明）。"/>
      <rect x="42" y="462" width="796" height="52" data-tip="⑥证据强度——晒单、故事、课程话术默认 D（〔B6-C04〕）；且多数宣称无法验证（结构⑦）。"/>
      <rect x="42" y="516" width="796" height="71" data-tip="⑦成本与容量——往返成本随频率放大（EX-P 口径）；个人小资金冲击成本尚可接受，但方法整体有容量天花板（大资金进出涨停股，自身即冲击）。"/>
      <rect x="42" y="589" width="796" height="71" data-tip="⑧失效条件——情绪跟风生态变化、涨停与 T+1 等制度参数调整※、同类参与者拥挤、监管执行收紧——任一条改写前提。"/>
      <rect x="42" y="662" width="796" height="71" data-tip="⑨与我的适配——四问在此章答案先行：需全天候盯盘、尾部亏损大、合规边界近、无法按本书框架执行——新手四问全部不通过。结论：不作为新手起步门派。"/>
    </g>
  </g>
</svg>
