<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 780" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="860" height="780" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="430" y="34" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">四问选择流程（示意档位，需自测校准）</text>

    <!-- 第一问 -->
    <rect x="260" y="80" width="300" height="56" rx="8" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="410" y="114" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">第一问 作息</text>
    <rect x="612" y="84" width="224" height="48" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.07" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="724" y="114" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">排除 E</text>
    <line x1="560" y1="108" x2="604" y2="108" stroke="var(--fig-red, #C26A63)" stroke-width="1.2"/>
    <path d="M612,108 L605,104.5 L605,111.5 Z" fill="var(--fig-red, #C26A63)"/>

    <line x1="410" y1="136" x2="410" y2="200" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.4"/>
    <path d="M410,212 L406.5,203 L413.5,203 Z" fill="var(--fig-ink-sub, #A69E8C)"/>

    <!-- 第二问 -->
    <rect x="260" y="212" width="300" height="56" rx="8" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="410" y="246" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">第二问 资金量</text>
    <rect x="612" y="216" width="224" height="48" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.07" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="724" y="236" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">期限不匹配</text>
    <text x="724" y="254" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">→ 全部排除，流程终止</text>
    <line x1="560" y1="240" x2="604" y2="240" stroke="var(--fig-red, #C26A63)" stroke-width="1.2"/>
    <path d="M612,240 L605,236.5 L605,243.5 Z" fill="var(--fig-red, #C26A63)"/>

    <line x1="410" y1="268" x2="410" y2="332" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.4"/>
    <path d="M410,344 L406.5,335 L413.5,335 Z" fill="var(--fig-ink-sub, #A69E8C)"/>

    <!-- 第三问 -->
    <rect x="260" y="344" width="300" height="56" rx="8" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="410" y="378" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">第三问 性格</text>
    <rect x="612" y="348" width="224" height="48" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.07" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="724" y="368" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">受不了常态难受</text>
    <text x="724" y="386" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">→ 排除</text>
    <line x1="560" y1="372" x2="604" y2="372" stroke="var(--fig-red, #C26A63)" stroke-width="1.2"/>
    <path d="M612,372 L605,368.5 L605,375.5 Z" fill="var(--fig-red, #C26A63)"/>

    <line x1="410" y1="400" x2="410" y2="464" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.4"/>
    <path d="M410,476 L406.5,467 L413.5,467 Z" fill="var(--fig-ink-sub, #A69E8C)"/>

    <!-- 第四问 -->
    <rect x="260" y="476" width="300" height="56" rx="8" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="410" y="510" text-anchor="middle" font-size="14" fill="var(--fig-ink, #E7E1D2)">第四问 回撤承受力</text>
    <rect x="612" y="480" width="224" height="48" rx="6" fill="var(--fig-red, #C26A63)" fill-opacity="0.07" stroke="var(--fig-red, #C26A63)" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="724" y="500" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">超出熔断线</text>
    <text x="724" y="518" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">→ 排除，或压缩后重测</text>
    <line x1="560" y1="504" x2="604" y2="504" stroke="var(--fig-red, #C26A63)" stroke-width="1.2"/>
    <path d="M612,504 L605,500.5 L605,511.5 Z" fill="var(--fig-red, #C26A63)"/>

    <!-- 输出框 -->
    <line x1="410" y1="532" x2="410" y2="562" stroke="var(--fig-accent, #B8626E)" stroke-width="1.6"/>
    <path d="M410,574 L406.5,563 L413.5,563 Z" fill="var(--fig-accent, #B8626E)"/>
    <rect x="260" y="574" width="300" height="54" rx="8" fill="var(--fig-accent, #B8626E)" fill-opacity="0.10" stroke="var(--fig-accent, #B8626E)" stroke-width="1.8"/>
    <text x="410" y="606" text-anchor="middle" font-size="14" fill="var(--fig-accent, #B8626E)">候选门派 1~2 个</text>

    <!-- 虚线外接：非本章范围 -->
    <line x1="410" y1="628" x2="410" y2="652" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M410,660 L406.5,651 L413.5,651 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <rect x="101" y="660" width="280" height="44" rx="6" fill="none" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="241" y="687" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">〔B8-C10〕时间盒</text>
    <line x1="381" y1="682" x2="414" y2="682" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <path d="M423,682 L416,678.5 L416,685.5 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <rect x="423" y="660" width="330" height="44" rx="6" fill="none" stroke="var(--fig-ink-sub, #A69E8C)" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="588" y="687" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">〔B8-C09〕工作流（非本章范围）</text>

    <text x="430" y="748" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">输出为候选名单，不是上线许可；每问档位宁严勿松</text>
  </g>
</svg>
