    <rect x="117.7" y="140" width="27.7" height="44" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.42" stroke="var(--fig-canvas, #0B0E14)" stroke-width="1"/>
    <rect x="145.4" y="140" width="55.4" height="44" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.55" stroke="var(--fig-canvas, #0B0E14)" stroke-width="1"/>
    <rect x="200.8" y="140" width="13.9" height="44" fill="var(--fig-accent, #B8626E)" fill-opacity="0.75" stroke="var(--fig-canvas, #0B0E14)" stroke-width="1"/>
    <rect x="214.7" y="140" width="115.3" height="44" fill="var(--fig-accent, #B8626E)" fill-opacity="0.32" stroke="var(--fig-canvas, #0B0E14)" stroke-width="1"/>
