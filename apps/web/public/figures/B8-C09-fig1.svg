<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 415" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="980" height="415" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="490" y="32" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">从拆解到上线：十二个月示意时间线（虚构）</text>

    <!-- 阶段引出标签（引线指向色段） -->
