    <text x="150" y="252" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">2</text>
    <text x="210" y="252" text-anchor="middle" font-size="11" fill="var(--fig-ink-sub, #A69E8C)">3</text>
