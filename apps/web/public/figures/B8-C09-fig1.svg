    <text x="905" y="204" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">停用（回流拆解池）</text>

    <text x="490" y="396" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">全部时点、事件与数字均为虚构示意</text>
