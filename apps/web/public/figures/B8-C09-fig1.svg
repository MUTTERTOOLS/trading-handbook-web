    <line x1="290" y1="186" x2="290" y2="266" stroke="var(--fig-red, #C26A63)" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="290" y="284" text-anchor="middle" font-size="12" fill="var(--fig-red, #C26A63)">熔断级回撤 12.4% 触线（独立示意）</text>

