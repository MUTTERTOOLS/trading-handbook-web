    <text x="131.6" y="216" text-anchor="middle" font-size="10" fill="var(--fig-ink-sub, #A69E8C)">4</text>
    <text x="145.4" y="216" text-anchor="middle" font-size="10" fill="var(--fig-ink-sub, #A69E8C)">5</text>
