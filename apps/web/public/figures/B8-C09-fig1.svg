    <text x="476" y="334" text-anchor="middle" font-size="11" fill="var(--fig-ink, #E7E1D2)">改动申请单</text>
    <line x1="518" y1="330" x2="526" y2="330" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.1"/>
    <path d="M532,330 L526,327 L526,333 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <rect x="532" y="316" width="44" height="28" rx="4" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.1"/>
    <text x="554" y="334" text-anchor="middle" font-size="11" fill="var(--fig-ink, #E7E1D2)">重验</text>
    <line x1="576" y1="330" x2="584" y2="330" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.1"/>
    <path d="M590,330 L584,327 L584,333 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <rect x="590" y="316" width="88" height="28" rx="4" fill="var(--fig-accent, #B8626E)" fill-opacity="0.10" stroke="var(--fig-accent, #B8626E)" stroke-width="1.3"/>
    <text x="634" y="334" text-anchor="middle" font-size="11" fill="var(--fig-accent, #B8626E)">切换 v1.1</text>

    <!-- 事件二：第 12 个月末端两个出口 -->
    <path d="M810,150 L822,150 L822,130 L828,130" fill="none" stroke="var(--fig-accent, #B8626E)" stroke-width="1.3"/>
    <path d="M835,130 L828,126.5 L828,133.5 Z" fill="var(--fig-accent, #B8626E)"/>
    <rect x="835" y="110" width="140" height="40" rx="6" fill="var(--fig-accent, #B8626E)" fill-opacity="0.08" stroke="var(--fig-accent, #B8626E)" stroke-width="1.4"/>
    <text x="905" y="134" text-anchor="middle" font-size="12" fill="var(--fig-accent, #B8626E)">加仓（A 级后逐级）</text>
    <path d="M810,175 L822,175 L822,200 L828,200" fill="none" stroke="var(--fig-red, #C26A63)" stroke-width="1.3"/>
