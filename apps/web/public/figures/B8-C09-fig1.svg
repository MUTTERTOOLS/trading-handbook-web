    <path d="M274,330 L268,327 L268,333 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <rect x="274" y="316" width="44" height="28" rx="4" fill="var(--fig-surface, #161A21)" fill-opacity="0.5" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.1"/>
