<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="400" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="450" y="32" text-anchor="middle" font-size="15" fill="var(--fig-ink, #E7E1D2)">时间盒甘特：粗扫、双卡深拆与选定（示意）</text>

    <!-- 周网格 -->
    <line x1="130" y1="70" x2="130" y2="330" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="236.7" y1="70" x2="236.7" y2="330" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="343.3" y1="70" x2="343.3" y2="330" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="450" y1="70" x2="450" y2="330" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="556.7" y1="70" x2="556.7" y2="330" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="663.3" y1="70" x2="663.3" y2="330" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="130" y1="330" x2="770" y2="330" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.5" stroke-width="1.4"/>

    <!-- 任务条（条尾标注产出物） -->
    <text x="122" y="105" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">粗扫</text>
    <rect x="130" y="84" width="106.7" height="32" fill="var(--fig-accent, #B8626E)" fill-opacity="0.55"/>
    <text x="244" y="105" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">粗扫卡若干＋名单</text>

    <text x="122" y="169" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">深度拆解卡 1</text>
    <rect x="236.7" y="148" width="213.3" height="32" fill="var(--fig-accent, #B8626E)" fill-opacity="0.55"/>
    <text x="458" y="169" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">拆解卡 1</text>

    <text x="122" y="233" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">深度拆解卡 2</text>
    <rect x="450" y="212" width="213.3" height="32" fill="var(--fig-accent, #B8626E)" fill-opacity="0.55"/>
    <text x="671" y="233" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">拆解卡 2</text>

    <text x="122" y="297" text-anchor="end" font-size="13" fill="var(--fig-ink, #E7E1D2)">并排比较与选定</text>
    <rect x="663.3" y="276" width="106.7" height="32" fill="var(--fig-accent, #B8626E)" fill-opacity="0.8"/>
    <text x="778" y="297" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">选定结论</text>

    <!-- 第 6 周末到期竖线（警示黄） -->
    <line x1="770" y1="66" x2="770" y2="330" stroke="var(--fig-yellow, #C9A35B)" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="770" y="56" text-anchor="middle" font-size="12.5" fill="var(--fig-yellow, #C9A35B)">时间盒到期，必须选定</text>

    <!-- 横轴：第 1~6 周 -->
    <text x="183.3" y="352" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">第 1 周</text>
    <text x="290" y="352" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">第 2 周</text>
    <text x="396.7" y="352" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">第 3 周</text>
    <text x="503.3" y="352" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">第 4 周</text>
    <text x="610" y="352" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">第 5 周</text>
    <text x="716.7" y="352" text-anchor="middle" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">第 6 周</text>

    <text x="450" y="384" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">装不下先砍数量或压缩粗扫，不把到期日往后挪（示意）</text>
  </g>
</svg>
