<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="560" fill="var(--fig-canvas, #0B0E14)"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="600" y="32" text-anchor="middle" font-size="15.5" fill="var(--fig-ink, #E7E1D2)">年度复盘看板（独立示意）</text>

    <!-- 栏分隔线 -->
    <line x1="305" y1="50" x2="305" y2="500" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="655" y1="50" x2="655" y2="500" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="895" y1="50" x2="895" y2="500" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.12" stroke-width="1"/>

    <!-- 栏一：数字区 -->
    <text x="160" y="70" text-anchor="middle" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">数字区</text>
    <text x="160" y="110" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">全年交易数</text>
    <text x="160" y="152" text-anchor="middle" font-size="34" fill="var(--fig-ink, #E7E1D2)">24<tspan font-size="15" fill="var(--fig-ink-sub, #A69E8C)"> 笔</tspan></text>
    <text x="160" y="205" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">违规率</text>
    <text x="160" y="247" text-anchor="middle" font-size="34" fill="var(--fig-ink, #E7E1D2)">8.3%</text>
    <text x="160" y="300" text-anchor="middle" font-size="12" fill="var(--fig-ink-sub, #A69E8C)">重大违规次数</text>
    <text x="160" y="342" text-anchor="middle" font-size="34" fill="var(--fig-ink, #E7E1D2)">0<tspan font-size="15" fill="var(--fig-ink-sub, #A69E8C)"> 次</tspan></text>

    <!-- 栏二：堆叠条形图（三类归因占比） -->
    <text x="480" y="70" text-anchor="middle" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">堆叠条形图</text>
    <text x="427.5" y="112" text-anchor="middle" font-size="12" fill="var(--fig-ink, #E7E1D2)">62.5%</text>
    <line x1="427.5" y1="116" x2="427.5" y2="120" stroke="var(--fig-ink, #E7E1D2)" stroke-width="1"/>
    <text x="555.9" y="112" text-anchor="middle" font-size="12" fill="var(--fig-accent, #B8626E)">29.2%</text>
    <line x1="555.9" y1="116" x2="555.9" y2="120" stroke="var(--fig-accent, #B8626E)" stroke-width="1"/>
    <text x="622" y="112" text-anchor="start" font-size="12" fill="var(--fig-yellow, #C9A35B)">8.3%</text>
    <rect x="340" y="120" width="175" height="40" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.55"/>
    <rect x="515" y="120" width="81.8" height="40" fill="var(--fig-accent, #B8626E)" fill-opacity="0.65"/>
    <rect x="596.8" y="120" width="23.2" height="40" fill="var(--fig-yellow, #C9A35B)" fill-opacity="0.7"/>
    <rect x="340" y="176" width="14" height="14" fill="var(--fig-ink, #E7E1D2)" fill-opacity="0.55"/>
    <text x="362" y="188" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">方差 62.5%</text>
    <rect x="340" y="206" width="14" height="14" fill="var(--fig-accent, #B8626E)" fill-opacity="0.65"/>
    <text x="362" y="218" text-anchor="start" font-size="12" fill="var(--fig-accent, #B8626E)">执行偏差 29.2%</text>
    <rect x="340" y="236" width="14" height="14" fill="var(--fig-yellow, #C9A35B)" fill-opacity="0.7"/>
    <text x="362" y="248" text-anchor="start" font-size="12" fill="var(--fig-yellow, #C9A35B)">策略失效 8.3%</text>
    <text x="340" y="290" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">方差占比高是中低频常态</text>

    <!-- 栏三：四格季度时间线 -->
    <text x="784" y="70" text-anchor="middle" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">四格季度时间线</text>
    <rect x="676" y="120" width="42" height="34" rx="5" fill="var(--fig-surface, #161A21)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="697" y="141" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">正常</text>
    <line x1="718" y1="137" x2="727" y2="137" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <path d="M734,137 L727,133.5 L727,140.5 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <rect x="734" y="120" width="42" height="34" rx="5" fill="var(--fig-surface, #161A21)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="755" y="141" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">正常</text>
    <line x1="776" y1="137" x2="785" y2="137" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <path d="M792,137 L785,133.5 L785,140.5 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <rect x="792" y="120" width="42" height="34" rx="5" fill="var(--fig-surface, #161A21)" fill-opacity="0.45" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="813" y="141" text-anchor="middle" font-size="11.5" fill="var(--fig-ink, #E7E1D2)">正常</text>
    <line x1="834" y1="137" x2="843" y2="137" stroke="var(--fig-ink-sub, #A69E8C)" stroke-width="1.2"/>
    <path d="M850,137 L843,133.5 L843,140.5 Z" fill="var(--fig-ink-sub, #A69E8C)"/>
    <rect x="850" y="120" width="42" height="34" rx="5" fill="var(--fig-yellow, #C9A35B)" fill-opacity="0.07" stroke="var(--fig-yellow, #C9A35B)" stroke-width="1.4"/>
    <text x="871" y="141" text-anchor="middle" font-size="11.5" fill="var(--fig-yellow, #C9A35B)">存疑</text>
    <text x="697" y="178" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-sub, #A69E8C)">一季度</text>
    <text x="755" y="178" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-sub, #A69E8C)">二季度</text>
    <text x="813" y="178" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-sub, #A69E8C)">三季度</text>
    <text x="871" y="178" text-anchor="middle" font-size="10.5" fill="var(--fig-ink-sub, #A69E8C)">四季度</text>
    <text x="784" y="212" text-anchor="middle" font-size="11.5" fill="var(--fig-yellow, #C9A35B)">第四季存疑：拥挤观察同向</text>

    <!-- 栏四：列表区（改动清单两条） -->
    <text x="1040" y="70" text-anchor="middle" font-size="13.5" fill="var(--fig-ink, #E7E1D2)">列表区</text>
    <text x="910" y="120" text-anchor="start" font-size="13" fill="var(--fig-accent, #B8626E)">①</text>
    <text x="932" y="120" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">把最常见的“迟入”加进盘前</text>
    <text x="932" y="138" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">快照检查项</text>
    <text x="932" y="156" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">（流程类，不动规则文本）</text>
    <line x1="910" y1="172" x2="1170" y2="172" stroke="var(--fig-ink, #E7E1D2)" stroke-opacity="0.1" stroke-width="1"/>
    <text x="910" y="198" text-anchor="start" font-size="13" fill="var(--fig-accent, #B8626E)">②</text>
    <text x="932" y="198" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">三问连续两季存疑且拥挤观察</text>
    <text x="932" y="216" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">同向，发起滑点假设的</text>
    <text x="932" y="234" text-anchor="start" font-size="12" fill="var(--fig-ink, #E7E1D2)">参数级重验</text>
    <text x="932" y="252" text-anchor="start" font-size="11.5" fill="var(--fig-ink-sub, #A69E8C)">（申请单，二级）</text>

    <text x="600" y="530" text-anchor="middle" font-size="12.5" fill="var(--fig-ink-sub, #A69E8C)">全部数字为独立示意；年度复盘只有立案权，没有通过权</text>

    <!-- 悬浮读数热区（D21）：透明命中块，悬停经 data-tip 显示读数 -->
    <g fill="transparent" stroke="none">
      <rect x="120" y="86" width="80" height="66" data-tip="全年交易 24 笔"/>
      <rect x="120" y="181" width="80" height="66" data-tip="违规率 8.3%（2 / 24 笔）"/>
      <rect x="120" y="276" width="80" height="66" data-tip="重大违规 0 次：红线零触犯"/>
      <rect x="340" y="120" width="175" height="40" data-tip="方差 62.5%：运气的成分（中低频常态）"/>
      <rect x="515" y="120" width="81.8" height="40" data-tip="执行偏差 29.2%：可自己改进的部分"/>
      <rect x="596.8" y="120" width="23.2" height="40" data-tip="策略失效 8.3%：触发规则重验（黄＝警示）"/>
      <rect x="850" y="120" width="42" height="34" rx="5" data-tip="第四季度存疑：拥挤观察同向，挂起复核"/>
      <rect x="910" y="100" width="270" height="76" data-tip="改动①：流程类——把最常见的迟入加进盘前快照检查项"/>
      <rect x="910" y="180" width="270" height="76" data-tip="改动②：申请单（二级）——三问连续两季存疑且拥挤同向，发起滑点假设参数级重验"/>
    </g>
  </g>
</svg>
